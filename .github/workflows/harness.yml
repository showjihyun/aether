# 로컬 hook 은 에이전트가 도는 곳에서 돕니다. 그래서 결정적인 우회를 원리적으로 막지
# 못합니다. hook 을 등록에서 빼거나, 열거에 없는 명령을 쓰거나, hook 이 읽을 수 없는
# 프로그램 안에서 쓰면 됩니다. 이 워크플로는 그 밖에서 돕니다.
# 무결성 보장의 실제 자리는 여기입니다. 로컬 hook 은 빠른 피드백용입니다.
name: harness

on:
  push:
    # main 만 봅니다. 모든 브랜치를 보면 PR 하나가 push 와 pull_request 로 두 번
    # 검증되어 같은 커밋에 verify 가 두 번 돕니다(2026-09-24 측정: PR 당 약 3.5분
    # ×2). PR 이 없는 브랜치는 병합 경로에 들어오지 않으므로 게이트가 필요한 자리는
    # PR 과 main 입니다.
    branches: ["main"]
  pull_request:
    # labeled / unlabeled 가 없으면 harness-change 라벨을 붙여도 검사가 다시 돌지
    # 않습니다. 기본 타입은 opened, synchronize, reopened 뿐입니다. 라벨로 통과를
    # 결정하면서 라벨 변경에 반응하지 않으면, 승인해도 빨간불이 그대로 남습니다.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Phase 0 제품 단계(spec 0001 2.11)가 uv 워크스페이스와 pnpm 워크스페이스를
      # 요구합니다. verify.sh 자신은 도구를 설치하지 않으므로 여기서 준비합니다.
      # 버전은 2026-09-11 기준 각 액션의 최신 메이저입니다 — 확인: 병합 전에 다시 확인.
      - uses: astral-sh/setup-uv@v10.2.0   # 이동 태그 v10 은 없음(v7 까지만). 릴리스 태그를 그대로 씁니다
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6    # 확인: 최신 메이저. 버전은 package.json 의 packageManager 필드를 따릅니다
      - uses: actions/setup-node@v7   # 확인: 최신 메이저
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 루트가 [tool.uv] package = false 가상 워크스페이스이므로 --all-packages 가
      # 필수입니다 — 옵션 없는 uv sync 는 멤버를 제거합니다(spec 2.2, improvement-log
      # 2026-09-11-009).
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile

      # spec 0002 2.11, D-15 (P1-9): smoke 단계가 쓰는 api·worker 이미지를 bake 로 먼저
      # 빌드해 GitHub Actions 캐시를 씁니다. web·migrate 는 target 에서 뺍니다 — smoke 는
      # web 을 띄우지 않고 migrate 는 api 와 같은 이미지(compose.ci.yaml)입니다.
      # bake 는 compose 파일의 상대 빌드 컨텍스트(context: ../..)를 compose 파일 위치가
      # 아니라 실행 위치 기준으로 해석합니다(P1-9 실측) — 그래서 workdir 를
      # infra/docker 로 둡니다. workdir 입력은 bake-action v6 에만 있고 v7 에서 제거되었습니다.
      # Dependabot 이 v7 을 제안하면 이 스텝을 다시 설계한 뒤에 올립니다.
      # 태그 실재 확인(refs/tags, 2026-09-16): setup-buildx-action@v4, bake-action@v6.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v6
        with:
          source: .
          workdir: infra/docker
          files: |
            compose.yaml
            compose.ci.yaml
          targets: api,worker
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      # 깨끗한 체크아웃에서 돕니다. 로컬에만 있는 상태가 결과를 만들지 못합니다.
      # 진입점의 실행 비트는 git 인덱스에서 옵니다. Windows 에서 core.fileMode=false 로
      # 100644 가 커밋되면 여기서 exit 126 으로 드러납니다.
      # SMOKE_NO_BUILD=1: smoke 단계가 위 bake 이미지를 --no-build 로 그대로 씁니다.
      - name: 하네스 검증
        env:
          SMOKE_NO_BUILD: "1"
        run: ./harness/scripts/verify.sh

      - name: 결과 파일
        if: always()
        run: cat .harness/verify.json || true

  protected:
    name: 보호 파일 변경 검토
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 보호 목록은 hooks/lib/guard-lib.sh 와 언어 팩이 소유합니다. 여기서 다시 적지
      # 않습니다. 목록이 갈라지면 로컬이 막는 것을 CI 가 보지 못합니다.
      - name: 보호 파일 변경 확인
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -uo pipefail
          git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" || true
          if hits="$(harness/scripts/protected-diff.sh "origin/${GITHUB_BASE_REF}")"; then
            echo "보호 파일 변경이 없습니다."
            exit 0
          fi
          echo "바뀐 보호 파일:"
          echo "${hits}"
          case ",${LABELS}," in
            *,harness-change,*)
              echo "harness-change 라벨이 있습니다. 사람 검토를 거친 변경으로 봅니다."
              exit 0
              ;;
          esac
          echo "::error::평가·게이트를 규정하는 파일이 바뀌었습니다. 이 PR 에는 harness-change 라벨과 사람 검토가 필요합니다. 라벨 없이 병합하지 마십시오."
          exit 1

  secrets:
    name: 비밀값 스캔
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 확인: 라이선스 조건(무료 사용 범위) — 조직 소유 저장소는 라이선스 키가
      # 필요할 수 있습니다. 개인 저장소는 무료입니다. 버전은 2026-09-11 기준 최신
      # 메이저(v3) — 병합 전 다시 확인.
      - uses: gitleaks/gitleaks-action@v3   # PR 스캔에는 GITHUB_TOKEN 이 필수(v2 부터). 개인 저장소는 라이선스 키 불필요
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
