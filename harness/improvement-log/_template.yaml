# improvement candidate 템플릿 (harness.improvement/1)
# 키 순서는 고정입니다. 순서를 바꾸거나 키를 추가·삭제하지 않습니다.
# 이 파일 자체는 검증 대상이 아닙니다. `_` 로 시작하는 파일은 validate 가 건너뜁니다.
# 새 항목은 손으로 복사하지 말고 `scripts/improvement-log.sh new` 로 발급받습니다.
# 각 키의 상세 명세: schema.md

# 1. 항목의 영구 식별자. YYYY-MM-DD-NNN. 파일명과 같아야 하며 스크립트가 발급합니다.
id: ""

# 2. 사건을 관측한 날짜. YYYY-MM-DD. 작성일이 아니라 실패가 발생한 날입니다.
date: ""

# 3. candidate | validating | promoted | rejected | expired. 새 항목은 항상 candidate 입니다.
status: candidate

# 4. 무엇이 잘못되었는지를 관측된 사실로만 1~3문장. 원인과 해결책을 섞지 않습니다.
symptom: ""

# 5. 재현·확인 근거. 실제 파일 경로, 테스트 이름, 오류 문구를 그대로 옮깁니다. 요약 금지.
evidence: |
  

# 6. 이 실수를 허용한 시스템의 결함. "에이전트가 잘못했다"에서 멈추지 않습니다.
root_cause: ""

# 7. 이번 사건에 실제로 가한 조치. 앞으로의 하네스 제안은 여기에 쓰지 않습니다.
fix: ""

# 8. low | medium | high. low=조건이 사라지면 재현 불가, medium=같은 모듈·작업 유형, high=프로젝트 전역.
recurrence_risk: ""

# 9. 개선 대상 하네스 요소 하나. HE-1 ~ HE-15. 둘 이상이면 항목을 나눕니다.
harness_element: ""

# 10. 재발을 막기 위해 시스템에 남길 변경 제안. 일반화하되 과잉 일반화하지 않습니다.
proposed_harness_change: ""

# 11. test | lint | arch-rule | hook | script | doc | skill | subagent | instruction.
#     결정적으로 강제할 수 있으면 항상 그쪽. instruction 은 마지막 수단입니다.
preferred_enforcement: ""

# 12. untrusted | validated. 새 항목은 출처와 무관하게 untrusted 입니다.
trust: untrusted

# 13. 승격 판정에서 실행할 task ID 와 회귀 판정 기준을 미리 적습니다.
#     판정 후에는 변경 전후 score, 계층별 점수, 근거 파일 경로를 덧붙입니다.
regression_check: |
  대상: 
  기준: 
  근거 파일: 

# 14. 재검토 책임 주체. candidate 단계에서는 unassigned 를 허용하고, promoted 전에 실제 주체로 바꿉니다.
owner: unassigned

# 15. 재검토 기한. YYYY-MM-DD 또는 none. none 은 근거를 regression_check 에 남길 때만 씁니다.
expires: ""
