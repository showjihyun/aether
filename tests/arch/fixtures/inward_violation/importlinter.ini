# Deliberately-violating fixture for tests/arch/test_import_linter.py.
# Mirrors the real .importlinter's package-internal contracts (architecture.md
# 3.1) for a single container `pkg`, with one import per rule that violates it.
[importlinter]
root_packages =
    pkg
include_external_packages = True

[importlinter:contract:ar8-fixture-inward-only]
name = AR-8 (fixture) adapters -> application -> domain, inward only
type = layers
layers =
    adapters
    application
    domain
containers =
    pkg

[importlinter:contract:ar9-fixture-core-is-framework-free]
name = AR-9 (fixture) domain and application import no framework or I/O
type = forbidden
source_modules =
    pkg.domain
    pkg.application
forbidden_modules =
    fastapi

[importlinter:contract:ar11-fixture-inbound-does-not-import-outbound]
name = AR-11 (fixture) inbound adapters do not import outbound adapters
type = forbidden
source_modules =
    pkg.adapters.inbound
forbidden_modules =
    pkg.adapters.outbound

[importlinter:contract:ar12-fixture-adapters-only-through-ports]
name = AR-12 (fixture) adapters reach the application only through ports
type = forbidden
source_modules =
    pkg.adapters
forbidden_modules =
    pkg.application.usecases
