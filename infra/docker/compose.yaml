# spec 0001 2.7. 개발용 기동. 첫 실행은 이미지 pull 이 필요합니다(온라인, R-1).
# 오프라인 판정(R-4)은 옆의 compose.offline.yaml 오버라이드 + `probe` 서비스입니다(C-3).
#
# 비밀값은 이 파일 옆의 `.env`(커밋 대상 아님, `.env.example` 참고)에서 읽습니다 —
# compose 는 compose 파일이 아니라 **자기 실행 디렉터리** 기준으로 `.env` 를 찾으므로
# 이 파일이 있는 `infra/docker/` 에 `.env` 를 둡니다.

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AETHER_CONTROL_PASSWORD: ${AETHER_CONTROL_PASSWORD}
      AETHER_DATA_PASSWORD: ${AETHER_DATA_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 역할 두 개만 만듭니다(spec 2.8) — 스키마·테이블·GRANT 는 migrate 가 소유합니다.
      - ./postgres/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # spec 0002 2.9, D-7 (P1-8): OTLP/HTTP 수신 → debug + file exporter. 기본 서비스로
  # 뜨지만 api·worker 의 `depends_on` 에는 넣지 않습니다(부팅을 막지 않음, DP-4) — 이
  # collector 가 늦거나 죽어도 실행은 계속되고, span 만 못 남깁니다. `file` exporter
  # 의 출력은 호스트 bind mount 로 봅니다(이미지에 셸이 없어 `exec cat` 이 불가).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ${AETHER_OTEL_DIR:-./out/otel}:/out

  # 일회성: `alembic upgrade head` 를 관리자 역할로 실행하고 끝나면 종료합니다(spec 2.7·2.8).
  # api 이미지를 재사용합니다 — 같은 uv workspace 설치가 필요하기 때문입니다.
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      args:
        AETHER_VERSION: ${AETHER_VERSION:-dev}
    environment:
      ALEMBIC_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["alembic", "-c", "apps/api/migrations/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      args:
        AETHER_VERSION: ${AETHER_VERSION:-dev}
    environment:
      # aether_control 역할 URL — 관리자 URL(위 migrate)과 다릅니다(spec 2.8, 세션 계약).
      AETHER_DATABASE_URL: postgresql+psycopg://aether_control:${AETHER_CONTROL_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # api 가 처음으로 Redis 를 씁니다(spec 0002 2.15, P1-5b) — 통지·투영 소비자.
      AETHER_REDIS_URL: redis://redis:6379/0
      # spec 0002 2.9, 2.15, D-7 (P1-8). `depends_on` 에 collector 를 넣지 않으므로
      # 없어도(또는 아직 안 떠도) api 부팅은 막히지 않습니다(DP-4).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
      args:
        AETHER_VERSION: ${AETHER_VERSION:-dev}
    environment:
      AETHER_REDIS_URL: redis://redis:6379/0
      # aether_data 역할 URL — api 의 AETHER_DATABASE_URL(aether_control)과 역할이
      # 다릅니다(spec 0002 2.15). worker 가 이 단위에서 처음 DB 를 씁니다.
      AETHER_DATABASE_URL: postgresql+psycopg://aether_data:${AETHER_DATA_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AETHER_MODEL_ADAPTER: ${AETHER_MODEL_ADAPTER:-fake}
      AETHER_MODEL_BASE_URL: ${AETHER_MODEL_BASE_URL:-http://llm:11434/v1}
      AETHER_MODEL_ID: ${AETHER_MODEL_ID:-qwen3.8:27b}
      AETHER_MODEL_API_KEY: ${AETHER_MODEL_API_KEY:-}
      AETHER_MODEL_THINKING: ${AETHER_MODEL_THINKING:-false}
      # spec 0002 2.9, 2.15, D-7 (P1-8). `depends_on` 에 collector 를 넣지 않으므로
      # 없어도(또는 아직 안 떠도) worker 부팅은 막히지 않습니다(DP-4).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # redis-cli 가 이미지에 없어 python -c 로 heartbeat 키를 직접 확인합니다(spec
      # 2.14). consumer 이름 계산은 Settings.worker_consumer 의 기본값(hostname)과
      # 같아야 합니다 — AETHER_WORKER_CONSUMER 를 명시하지 않는 한 컨테이너
      # hostname 이 곧 이 healthcheck 의 hostname 과 같습니다(같은 컨테이너 안).
      test: ["CMD", "python", "-c", "import os,sys,redis; c=redis.Redis.from_url(os.environ['AETHER_REDIS_URL']); sys.exit(0 if c.exists(f\"aether:worker:{os.environ.get('AETHER_WORKER_CONSUMER', __import__('socket').gethostname())}:heartbeat\") else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # spec 0002 2.5, D-1 (P1-3): 로컬 LLM 서버(Ollama, OpenAI-호환 API). `llm` 프로파일로
  # 묶어 기본 `up` 과 `probe`(spec 0001 R-4)에 영향이 없게 합니다 — `docker compose
  # --profile llm up -d llm` 으로만 뜹니다. 포트는 이 네트워크 안에서만
  # (`http://llm:11434`) — 호스트에 공개하지 않습니다. 실제 모델로 돌리는 절차는
  # 루트 README "실제 모델로 돌리기" — 판정(verify·smoke)은 fake 어댑터로만 갑니다(C-7).
  llm:
    image: ollama/ollama:0.34.0@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
    profiles: ["llm"]
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        AETHER_VERSION: ${AETHER_VERSION:-dev}
    environment:
      AETHER_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  ollama_models:
