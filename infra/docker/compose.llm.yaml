# spec 0006 R-8, R-9, D-5, D-12 (MVP-3): 로컬 LLM 으로 도는 오버라이드. 사용:
#   docker compose -f compose.yaml -f compose.llm.yaml up -d --wait
# 기본값(`compose.yaml` 하나, `smoke`)은 바뀌지 않습니다 - 판정의 기본은 fake 어댑터입니다
# (spec 0002 C-7, 0006 D-10). 이 파일을 얹을 때만 worker 가 `llm` 서비스를 부릅니다.
#
# - `llm` 의 프로파일을 비웁니다(`!reset []` - 값을 비우는 병합 지시자입니다. 포트처럼
#   리스트를 **바꾸려면** `!override [...]` 입니다). 이 파일이 얹히면 `llm` 은 항상 켜집니다.
# - 모델 파일은 `ollama_models` 볼륨에 미리 있어야 합니다. 받는 것은 이 파일도 부팅 경로도
#   아닙니다 - 네트워크 있는 환경에서 `scripts/fetch-model.sh` 를 사람이 1회 실행합니다
#   (D-5, DP-4). 볼륨이 비어 있으면 worker 가 시작 지점에서 그 스크립트를 가리키며 멈춥니다.
# - `AETHER_MODEL_ID` 는 .env 가 정합니다(제품 기본 `qwen3.8:27b`). `e2e` 는 판정용 소형
#   모델 `qwen2.5:0.5b` 를 .env 로 넘깁니다(D-12) - 이 파일이 모델을 고르지 않습니다.
services:
  llm:
    profiles: !reset []
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  worker:
    environment:
      AETHER_MODEL_ADAPTER: openai_compatible
      AETHER_MODEL_BASE_URL: http://llm:11434/v1
    depends_on:
      llm:
        condition: service_healthy
