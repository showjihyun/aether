# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-10-18-001
date: 2026-10-18
status: candidate
symptom: "`gh pr edit --add-label` 이 Projects(classic) 관련 GraphQL 오류로 **전체 실패**하는데 종료 코드만 보면 성공처럼 지나간다. 라벨이 붙지 않은 채로 '붙였다' 고 믿고 다음 단계로 갔다"
evidence: |
  2026-10-18, PR #167(보호 파일 `harness.config` 변경). `gh pr edit 167 --add-label harness-change`
  의 출력은 이것뿐이었습니다:
    GraphQL: Projects (classic) is being deprecated ... (repository.pullRequest.projectCards)
  라벨 이름은 그 메시지에 나오지 않고, 그 뒤 `gh pr view --json labels` 는 **`[]`** 였습니다.
  그래서 "보호 파일 변경 검토" 가 `LABELS:` 빈 값으로 실패했고, 저는 그것을 **"라벨 전에 돌아서
  그렇다"** 고 잘못 진단해 `gh run rerun --job` 으로 재실행했습니다. 재실행은 **같은 이벤트
  페이로드**를 다시 쓰기 때문에 라벨이 여전히 비어 있었고 또 실패했습니다(두 번째 오진).
  해결: `gh api -X POST repos/<owner>/<repo>/issues/<n>/labels -f "labels[]=harness-change"`.
  그 뒤 `labeled` 이벤트로 새 run(39044038961)이 돌아 세 검사 전부 통과했습니다.
  비용: 약 12분(verify 재실행 5분 + 오진 2회).
  곁가지로 드러난 사실 하나: 워크플로는 `labeled`·`unlabeled` 를 **이미** 듣고 있습니다
  (`.github/workflows/harness.yml` 의 주석이 그 이유를 적어 두었습니다). 그러므로 라벨만
  제대로 붙으면 재실행은 필요하지 않습니다 — **재실행은 라벨 문제의 해법이 아닙니다.**
root_cause: "`gh` 의 PR 편집은 라벨·담당자·프로젝트를 한 GraphQL 변경으로 묶어 보내므로, 폐기된 Projects(classic) 필드 하나가 라벨 추가까지 **같이** 실패시킨다. 그리고 그 실패는 사람이 읽는 경고처럼 보인다 — 무엇이 적용되지 않았는지 말해 주지 않는다"
fix: 라벨은 REST(`gh api .../issues/<n>/labels`)로 붙이고, **붙은 뒤 `gh pr view --json labels` 로 확인**한다. 확인 없이 다음 단계로 가지 않는다. 보호 파일 PR 은 라벨이 게이트이므로 이 확인이 그 게이트의 일부다
recurrence_risk: medium
harness_element: HE-6
proposed_harness_change: "없음(지금은). 이 저장소의 CI 와 라벨 규칙은 옳게 동작했습니다 — 틀린 것은 라벨을 붙이는 쪽의 확인 절차입니다. 반복되면 `scripts/` 에 `label-pr.sh`(REST 로 붙이고 되읽어 확인하는 한 줄짜리)를 두는 것이 후보입니다. 그 전에 사건 2회를 기다립니다(검증되지 않은 lesson 을 승격하지 않습니다)"
preferred_enforcement: doc
trust: untrusted
regression_check: |
  대상: 다음 보호 파일 PR(H-2b, MVP-3 과 같은 PR).
  기준: 라벨을 붙인 직후 `gh pr view --json labels` 가 그 이름을 보여주고, "보호 파일 변경
  검토" 가 **재실행 없이** 통과한다. 재실행이 필요했다면 이 후보는 닫지 않는다.
