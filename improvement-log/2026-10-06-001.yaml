# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-10-06-001
date: 2026-10-06
status: candidate
symptom: apps/worker 의 테스트 1건이 그 패키지 스위트를 한 번에 돌릴 때만 간헐적으로 실패한다. 단독 실행은 통과한다. 테스트 사이에 상태가 새는 것이고, 실패가 변경과 무관하므로 실행자가 '내 변경이 깬 것인가' 를 확인하는 데 시간을 쓴다
evidence: |
  2026-10-06 P3-2a. 실행자 보고: `apps/worker/tests/test_handle_run_requested.py::
  test_missing_declaration_is_acked_and_logs_a_warning` 이 apps/worker 전체 스위트에서 간헐 실패,
  단독 실행은 통과. `git stash` 로 변경을 전부 제거한 베이스라인에서도 같은 실패가 재현되어
  그 단위와 무관함을 확인했다. 같은 라운드의 verify 전체 실행(api-unit 514 passed)에서는 통과했다.
  비용: 실행자가 베이스라인 재현까지 수행해 무관함을 증명했다(옳은 처리이고, 그래서 비용이 들었다).
  같은 부류의 앞선 관측: P2-6 에서 FakeAgentRepository 의 정렬이 같은 마이크로초 생성 시 UUID
  문자열에 좌우되어 순서 의존 실패가 났다(그때는 fake clock 주입으로 고쳤다).
root_cause: 테스트가 프로세스 전역 상태(로깅 핸들러·캡처, 모듈 수준 캐시, 환경변수 중 하나)를 공유하고 그것을 되돌리지 않는다. 어느 것인지는 아직 특정하지 않았다 — 특정하는 것이 이 후보의 첫 단계다
fix: 이번에는 베이스라인 재현으로 무관함만 확인하고 고치지 않았다(범위 밖). 원인 특정이 남았다
recurrence_risk: medium
harness_element: HE-6
proposed_harness_change: "(사람 결정) (1) `pytest -p no:randomly`·`-x --ff` 로 실패 순서를 고정 재현해 어느 선행 테스트가 상태를 남기는지 먼저 특정한다. (2) 원인이 로깅 캡처라면 그 테스트가 핸들러를 fixture 로 복원하게 한다. (3) 재발 방지로 `pytest-randomly` 류의 순서 무작위화를 `api-unit` 에 넣는 것을 검토한다 — 순서 의존을 숨기지 않고 드러내는 쪽이 낫지만, 간헐 실패가 게이트를 흔들 수 있으므로 도입은 사람이 결정한다"
preferred_enforcement: test
trust: untrusted
regression_check: |
  대상: 원인 특정 뒤 apps/worker 스위트 20회 반복 실행.
  기준: 실패 0회. 단독 실행과 스위트 실행의 결과가 같다.
  순서 무작위화를 도입한 경우: 세 번의 서로 다른 시드에서 전부 통과한다.
