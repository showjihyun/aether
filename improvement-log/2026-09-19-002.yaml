# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-09-19-002
date: 2026-09-19
status: validating
symptom: 성능 판정 단계(bench)가 측정값이 아니라 신선도 때문에 실패했다. 같은 verify 실행 안에서 smoke 가 벤치를 기록했는데, 프로세스가 중간에 멈춰 판정이 47분 뒤에 돌아 30분 상한을 넘겼다. 측정값 자체는 기준 안이었다
evidence: |
  .harness/logs/bench.log (2026-09-19): "check-bench: bench 결과가 오래되었습니다
  (measured_at=2026-09-19T04:43:00Z, age=2820s > 1800s)" / "p95=62.2 ms, 기준=150 ms — 측정이 오래됨".
  같은 실행의 .harness/logs/smoke.log 마지막 줄은 "smoke: pass (... 37s)" 로 정상이고
  infra/docker/out/smoke-bench.json 의 p95 는 62.2 ms 로 기준 150 ms 안.
  곧바로 다시 실행한 verify 는 3분 43초에 18/18 통과.
  배경: 그 실행은 백그라운드로 돌던 셸이었고 smoke 종료와 bench 시작 사이에 47분이 비었다.
root_cause: scripts/check-bench.sh 의 신선도 검사가 measured_at 을 **벽시계 현재 시각**과 비교한다. 같은 verify 실행인지와 무관하므로, 실행이 느려지거나 멈추면 정상 측정도 오래된 것으로 판정된다. 상한을 늘리는 것은 반대 방향의 약화다
fix: 이번에는 게이트를 고치지 않고 verify 를 다시 실행해 통과를 확인했다(측정값은 처음부터 기준 안이었다)
recurrence_risk: medium
harness_element: HE-11
proposed_harness_change: "신선도 기준을 '같은 실행 안인가' 로 바꾼다: measured_at 을 벽시계 대신 .harness/logs/smoke.log 의 수정 시각과 비교해, 벤치 결과가 그 smoke 로그보다 오래되었을 때만 실패시킨다. 두 시각이 함께 밀리므로 실행이 느려도 거짓 실패가 나지 않고, 어제 결과로 통과시키는 것은 여전히 막힌다"
preferred_enforcement: script
trust: untrusted
regression_check: |
  대상: bench 단계, tests/scripts/test_check_bench.py.
  기준: (1) 정상 verify 에서 통과, (2) 벤치 파일만 오래된(직전 실행의 smoke 로그보다 이전) 트리에서 실패, (3) smoke 와 bench 사이에 인위로 지연을 준 실행에서 통과. 기존 5개 테스트 케이스는 유지하고 신선도 케이스만 새 기준으로 교체.
  판정(2026-09-19, PG 절차 3~4): 적용 완료(PR #51). 대표 task 쪽 근거 — 신선도 케이스 4건을 포함한 tests/scripts 27건 통과, verify 18/18 에서 bench 단계가 새 규칙으로 통과. 거짓 실패 상황(벤치·smoke 로그가 둘 다 2시간 전이고 서로 60초 차)이 통과로, 이전 실행 벤치(2820초 이전)는 실패로 판정됨. held-out: **미실행**(AD-3 예정).
owner: unassigned
expires: 2026-12-19
