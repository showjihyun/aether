# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-10-17-001
date: 2026-10-17
status: candidate
symptom: 주 세션과 위임 에이전트가 **같은 작업 트리에서 동시에** 파일을 고치면, 한쪽의 커밋되지 않은 변경이 다른 쪽의 git 위생 작업에 조용히 지워진다. 지워진 쪽은 자기 편집이 사라진 것을 다음 `git status` 에서야 안다
evidence: |
  2026-10-17, 이 세션에서 한 번. 주 세션이 위임(열 단위 GRANT 좁히기)을 띄워 둔 상태에서
  같은 트리에 두 가지를 편집했다 — `tests/scripts/test_guard_hook_cost.py`(벽시계 측정을
  최소값으로)와 `improvement-log/` 두 파일(결정 기록).
  위임 에이전트는 통합 테스트를 돌리던 중 그 변경을 **자기 작업의 부산물로 오인**해
  `git checkout improvement-log` 로 되돌렸고, 무관한 테스트 파일이 `ruff format` 에 걸린 것도
  되돌렸다. 에이전트는 그 사실을 보고에 **스스로 적었다**(그래서 복구가 가능했다).
  손실: 주 세션의 편집 셋 전부. 복구: 대화에 남은 원문과 스크래치 파일로 다시 적용(약 10분).
  `git stash` 사고도 앞선 두 위임에서 각각 한 번 보고됐다(둘 다 즉시 pop).
root_cause: 위임 모델이 **한 작업 트리를 공유**한다. 에이전트의 브리프는 "커밋하지 마십시오" 를 말하지만 "작업 트리에 네가 만들지 않은 변경이 있을 수 있다" 는 말하지 않았고, 주 세션 쪽에도 "위임 중에는 편집하지 않는다" 는 규칙이 없었다. 그 결과 양쪽 다 트리를 자기 것으로 가정한다
fix: |
  2026-10-17 에 이 세션에서 한 대처는 복구와 직렬화뿐이다 — 위임이 끝난 뒤 순서대로 다시
  적용했다. 구조적 고치기는 아래 제안으로 남긴다.
recurrence_risk: high
harness_element: HE-7
proposed_harness_change: "(사람 결정) 셋 중 하나 또는 조합. (1) **브리프 템플릿에 한 줄**: `.claude/agents/implementer.md` 에 \"작업 트리에 네가 만들지 않은 변경이 있을 수 있다. `git checkout`·`git restore`·`git stash` 로 넓게 되돌리지 말고, 네가 만든 경로만 다룬다\" 를 넣는다. 가장 싸고 보호 파일이 아니다. (2) **주 세션 규칙**: 위임이 도는 동안 주 세션은 편집하지 않는다(읽기·측정만). 지금 세션이 손으로 지킨 것을 명시한다. (3) **격리**: 위임을 git worktree 로 띄워 트리를 분리한다 — 가장 확실하지만 `uv`·`.venv`·testcontainers 가 트리마다 다시 서는 비용이 크다. (1)+(2) 를 먼저, (3) 은 손실이 다시 나면."
preferred_enforcement: hook
trust: untrusted
regression_check: |
  대상: 다음 위임 사이클(REP-* 중 위임이 섞인 것).
  기준: 위임이 도는 동안 주 세션의 커밋되지 않은 변경이 살아 있다. 또는 위임 보고에
  "내가 만들지 않은 변경을 되돌렸다" 가 없다.
  근거 파일: 이 후보와 그 사이클의 PR 본문(위임 보고의 "주의" 절).
  반대 확인: 아직 없음 — 한 번의 사건이므로 규칙이 아니라 후보다(AGENTS.md Learning).
owner: unassigned
expires: 2027-01-17
