  찍혔고 한 테스트가 25,300초 "통과" 했습니다 — 호스트가 중간에 잠든 것으로 보입니다.
  벽시계 측정은 그런 실행을 **구별하지 못하므로**, 떠돌이 durations 출력 하나를 근거로
  삼지 않습니다(두 번째 실행이 141초였습니다).
  --- 2026-10-17, MVP-1 이 `e2e` **없이** 예산을 넘겼습니다 (결정이 급해졌습니다) ---
  `--full`: 20/20 통과, 합계 **626,073 ms** — 예산 600,000 을 **4.3% 초과**(선택 실패).
    api-integration  **247,911 ms**  (P4-5 153,812 → MVP-0 151,107 → **MVP-1 247,911**)
    harness-scripts   105,666 ms (정상 범위)
  원인은 분명합니다 — MVP-1 이 **compose 를 띄우는 통합 2건**을 더했습니다(실행자 측정
  약 86초, 스택 하나를 공유). 환경 변동이 아니고 `harness-scripts` 도 정상이었습니다.
  **이것이 spec 0006 D-6 이 예고한 상황입니다**: `e2e` 단계를 **더하기 전에** 이미 넘었고,
  `e2e` 는 `smoke`(약 110초) 급이므로 더하면 CI 전량이 확실히 넘습니다.
  그래서 H-2(보호 파일 `harness.config` + 예산 결정)가 **형식이 아니라 실제로 막는**
  자리가 됐습니다. 선택지는 그대로 셋이고(예산 상향 / `harness-scripts` 를 CI 전용 /
  `api-integration` 의 컨테이너·스택 재사용) **에이전트가 고르지 않습니다**(EI-2).
  측정이 가리키는 쪽은 셋째입니다 — compose 를 띄우는 통합이 이제 `api-integration` 의
  절반을 넘고, 그 스택을 테스트 사이에 재사용하면 가장 큰 몫이 줄어듭니다. 대가는
  교차 간섭이고 P4-4 에서 한 번 겪었습니다.
  --- 2026-10-17, **사람이 결정했습니다**: 예산 600,000 → 900,000 ms ---
  선택지 셋을 올렸고 사람(showjihyun)이 **(1) 상향 + 근거 기록**을 골랐습니다. 근거는 둘입니다 —
  600초는 제품 단계가 **10개**였던 Phase 0 의 값이고(spec 0001 D-12) 지금은 20개에 컨테이너가
  셋이며, `e2e` 를 더하면 전량이 약 736,000 ms 입니다(626,073 + smoke 급 약 110초). 900,000 은
  거기에 약 20% 여유입니다.
  **대안 둘을 버리지 않았습니다.** (2) `harness-scripts`(105,666 ms, 제품 아님)를 CI 전용으로,
  (3) `api-integration` 의 compose 스택 재사용(상위 12건이 그 단계의 35%, 열한 건이 Phase 4 의
  사슬·파킹 테스트) — 이 후보는 그 둘로 **열려 있고**, 둘 중 하나가 닫히면 예산을 다시 내리는
  것이 목표입니다. 상향은 측정을 **대신한** 것이 아니라 측정이 끝날 때까지 게이트를 막지 않기
  위한 것입니다.
  값이 사는 자리도 함께 고쳤습니다: 지금 예산은 `verify.sh` 의 기본값에만 있어서 **사람이
  소유하는 숫자가 보호 파일 밖**에 있었습니다. `harness.config` 에 `HARNESS_VERIFY_BUDGET_MS`
  를 선언하고, `tests/scripts/test_verify_budget.py` 가 **값과 배선을 함께** 고정합니다 —
  `verify.sh` 는 그 키를 기본값과 함께 읽으므로(`:-600000`) 키 이름을 한 글자 틀리면 설정이
  조용히 무시됩니다. 그 배선 테스트는 키 이름을 `..._MSEC` 로 바꾼 변이에서 발화했습니다.
  **`e2e` 단계 등록은 이 결정에서 **분리**했습니다**(plan 0006 개정 1): `harness.config` 10~14행이
  "없는 코드를 검사하는 단계를 미리 적지 않습니다" 라고 금지하고 있어서, 빈 진입점을 지금
  등록하면 CI 가 상시 빨개지거나(required=true) 아무것도 판정하지 않는 초록이 생깁니다.
  단계는 `scripts/e2e.sh` 가 처음 무언가를 단언하는 PR(MVP-3)에서 꽂습니다.
  --- 2026-10-18, **상향 직후의 실측이 상향의 근거를 깎았습니다** ---
  H-2a 적용 뒤 전량: 20/20 통과, 필수 0·선택 0, 합계 **735,450 ms / 900,000**(`wall_clock_suspect`
  false). 문제는 이 숫자가 **`e2e` 없이** 나왔다는 것입니다 — 전날 626,073 을 근거로 "`e2e` 를
  더하면 약 736,000, 900,000 은 20% 여유" 라고 적었는데, **그 736,000 을 `e2e` 없이 이미
  찍었습니다.** 단계별로 api-integration **265,816**(MVP-1 의 247,911 보다 +18초, 같은 코드),
  smoke 126,513, harness-scripts 120,060 — 셋 다 이전 실행 대비 상단입니다.
  즉 합계의 흔들림 폭이 100초 이상이고(2026-10-06 에 적은 것과 같은 관측), `e2e` 를 더하면
  **740,000~845,000** 이 되어 900,000 의 여유는 **6~18%** 입니다. `harness.config` 의 근거
  주석을 그 범위로 **정정했습니다**(틀린 근거를 남겨 두지 않기 위해).
  결론은 바뀌지 않지만 긴급도가 올라갑니다: 900,000 은 **임시**이고, 다음에 또 올리는 것은
  답이 아닙니다. 남은 두 수(harness-scripts 를 CI 전용 / api-integration 의 compose 스택
  재사용)가 이제 "언젠가" 가 아니라 **다음 하네스 변경 자리**입니다.
root_cause: 단계가 10개에서 18개로 늘고 컨테이너가 추가되는 동안 예산 값은 그대로였다. 그리고 api-unit 한 단계가 합계의 절반을 차지하는데 그 안에서 무엇이 느린지는 집계되지 않는다
fix: 이번에는 숫자를 기록하고 사람 판단에 올린다. 임계값을 에이전트가 올리지 않는다(EI-2). 2026-10-07 에 사람이 **(2) 쪼개기**를 골랐고 적용했다 — api-unit 한 단계를 api-unit(제품: packages·apps)·harness-arch(tests/arch)·harness-scripts(tests/scripts) 셋으로 나눴다. 합집합은 쪼개기 전과 같다(524건 = 413 + 25 + 86). 예산은 올리지 않았다
recurrence_risk: high
harness_element: HE-3
proposed_harness_change: "(사람 결정) 셋 중 하나 또는 조합. (1) 예산을 올린다 — 단계가 18개이고 컨테이너가 셋이므로 600초는 Phase 0 의 값이다. 올린 값과 근거를 harness.config 에 적는다. (2) api-unit 을 쪼갠다 — 그 한 단계가 합계의 절반(313초)이고 그 안의 구성이 보이지 않는다. 패키지별로 나누면 어느 패키지가 느린지가 계층 점수에 드러난다. (3) 느린 테스트를 찾아 고친다 — `pytest --durations=20` 으로 상위를 보고 그중 컨테이너·슬립·네트워크 대기를 제거한다. 측정 없이 (1)만 하는 것은 추천하지 않는다. **2026-10-15 에 선택지가 좁아졌다**: 쪼개기(2)는 적용됐고, 그 뒤 측정에서 합계의 83%가 `harness-scripts` 한 단계였다(1,994,487 ms, 같은 날 다른 실행 253,760 ms). 그러므로 남은 수는 (3) 이고, 구체적으로는 ㉠ `tests/scripts` 의 가드 테스트가 같은 가드를 수백 번 fork 하는 구조를 줄이거나(한 프로세스에서 여러 payload 를 판정) ㉡ 그 단계를 `required=false` 가 아니라 **별도 워크플로**(CI 에서만 전량)로 옮기는 것이다. ㉡ 은 로컬 완료 근거를 약화시키므로 `HARNESS_DEFERRED_STEPS` 와 같은 모양이어야 하고, 둘 다 `harness.config`·`harness/**` 이므로 사람 결정이다"
preferred_enforcement: doc
trust: untrusted
regression_check: |
  2026-10-07 쪼개기로 드러난 사실: 느린 것은 제품 테스트가 아니라 **하네스 자신의 스크립트
  테스트**였다. 단계별 실측 — packages/runtime 3초(216건), packages/mcp·policy·context 16초(37건),
  apps/api·worker 4초(160건), tests/arch 31초(25건), tests/scripts **261초(86건)**. 즉 api-unit
  314초 중 83% 가 tests/scripts 였고, 제품 테스트 전부는 23초다. 한 단계로 묶여 있어서 그 사실이
  보이지 않았다 — 쪼개기의 값이 여기 있다(예산을 올렸다면 이것을 영구히 가렸을 것이다).
  쪼갠 뒤 전량 verify: 20단계 통과, 합계 546,271 ms(예산의 91%). 가장 비싼 단계는
  harness-scripts 212.8초, 그다음 smoke 101.9초.
  남은 일(다음 후보로 분리할 것): tests/scripts 의 86건이 각각 번들을 복사하고 bash 를 띄운다.
  세션 범위 fixture 로 복사를 1회로 줄이면 그 단계가 크게 줄 것으로 보인다 — 측정 후 판단한다.
  대상: 결정 적용 뒤 verify 3회.
  기준: 세 번 모두 선택 실패 0건이고 합계가 예산의 85% 이하(새 예산 900,000 의 85% = 765,000 ms — `e2e` 를 더한 뒤의 예상 736,000 이 그 안에 있어야 한다). (2)를 골랐다면 쪼갠 단계들의
  합이 이전 api-unit 소요와 같은 범위여야 한다(테스트를 잃지 않았다는 확인).
  (3)을 골랐다면 `pytest --durations=20` 의 상위 항목이 바뀌어야 한다.
