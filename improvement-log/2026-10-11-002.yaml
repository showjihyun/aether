# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-10-11-002
date: 2026-10-11
status: validating
symptom: PreToolUse 가드가 **모든 Bash 도구 호출마다** 2.2~3.3초를 씁니다. 무해한 `echo hello` 에도 같은 비용이 듭니다. 에이전트 작업의 단위가 셸 명령이므로 이 상수는 세션 전체에 곱해집니다 — 명령 100건이면 약 4분이 판정이 아니라 가드 시작에 듭니다
evidence: |
  2026-10-11 실측(Windows 11 + Git Bash, 이 저장소):
    payload {"tool_name":"Bash","tool_input":{"command":"echo hello"}}
      bash scripts/guard-protected.sh  →  2.39 / 2.24 / 2.25초
    보호 경로를 건드리는 payload(차단되는 경우)  →  3.31 / 3.24 / 3.24초
  bash -x 프로파일(258줄, span 2.2초)의 내역:
    1.224초  guard-protected.sh:116 — 번들 가드 위임
             (`bash harness/hooks/guard-evaluation-tampering.sh` 한 프로세스가 스택
              감지 + 언어 팩 6개 병합을 매번 다시 한다)
    약 1.0초 guard-protected.sh:95-99 — json_field 가 필드마다
             `printf | grep -oE | head | sed` 파이프라인(프로세스 4개)을 새로 띄운다.
             jq 가 있으면 한 번에 끝나는데 이 환경에는 jq 가 없어 전량 fallback 이다.
  이 비용이 보이지 않았던 이유: 가드는 verify 단계가 아니라 도구 호출마다 도는 훅이라
  `.harness/verify.json` 의 어느 숫자에도 나타나지 않는다. 20단계 합계가 471초일 때도
  그 바깥에서 명령마다 2.3초가 따로 들고 있었다.
  이 후보는 2026-10-09-001 의 2순위("`_copy_bundle` 약 35초")를 **대체**한다. 그 가설은
  틀렸다 — copytree 는 실측 0.08초이고(파일 90개, 968 KB), 12건 전부 합쳐 1초가 안 된다.
  guard 테스트 1건이 2.5~3.3초인 것은 복사가 아니라 **가드 호출 자체**였다.

  --- 수정 착수 후 추가 측정(2026-10-11) ---
  제안 (2)는 "스택 감지·언어 팩 병합 결과를 호출 사이에 **재사용**" 이었다. 착수 전에
  1.224초의 내역을 더 쪼개 보니 재계산이 아니라 **fork** 였다:
    guard-lib source        26 ms
    common.sh source       100 ms
    detect-stack source     68 ms
    harness_lang_load_packs 100 ms   ← 팩 6개 파일 읽기
    lang_all_protected_patterns 429 ms
    lang_all_warn_patterns      237 ms   ← 둘이 합쳐 666 ms, 패턴은 66+66개뿐
  뒤의 두 줄은 배열을 잇는 일인데 왜 666ms 인가 — `up="$(_lang_upper "$p")"` 가 순수
  bash 연산을 명령 치환으로 감싸고 있었다. `_lang_upper` 는 "hook 이 매 편집마다
  실행되므로 tr 대신 bash 내장만 씁니다. fork 1회는 약 30ms" 라는 주석을 달고 내장만
  쓰는데, 부르는 쪽이 그 값을 명령 치환으로 받아 fork 를 **밖에서 다시** 내고 있었다.
  팩 6개 × (팩 1 + kind 2) × 목록 2벌 = fork 36회다.
  같은 입력에서 fork 없는 변형을 만들어 비교하면 478ms → 39ms 이고 값은 동일하다.
  json_field 도 같은 모양이었다. 필드 7개에 프로세스 28개(874ms)이고, 한 번의 grep 으로
  모으면 85ms 이며 7개 값이 전부 같다.
root_cause: 가드가 같은 답을 매번 **더 비싸게** 구한다. 재계산이 비싼 것이 아니라, 순수 bash 연산을 명령 치환으로 감싸고 JSON 필드를 필드마다 파이프라인으로 뽑아 fork 수가 팩 수·필드 수에 비례한다. 이 플랫폼에서 fork 1회는 약 20ms 이고, 그 비용은 verify 단계가 아니라 도구 호출마다 든다
fix: |
  2026-10-11, 사람 승인(showjihyun)으로 **fork 제거**를 적용했다. 캐시는 넣지 않았다.
    1. harness/scripts/lib/detect-stack.sh — `_lang_upper_into <출력변수> <문자열>` 을
       더하고, 패턴 병합·팩 검증·보안 패턴의 세 자리에서 명령 치환을 없앴다.
       `_lang_upper` 는 그대로 뒀다(팩이 쓸 수 있는 계약이고 값도 같다).
    2. harness/hooks/guard-evaluation-tampering.sh, scripts/guard-protected.sh —
       `json_bulk_init` 으로 필드를 **한 번의 grep** 으로 모으고, `json_field_var` /
       `json_unescape_var` 로 값을 변수에 직접 담는다. 부르는 쪽도 함께 바꿨다 —
       `$(json_field …)` 로 받으면 그 치환의 서브셸에 모아 둔 결과가 남지 않아 호출마다
       다시 뽑는다(모은 효과가 그대로 사라진다).
  실측 결과: `echo hello` 2.24초 → 1.01초, 차단되는 경우 3.24초 → 0.93초.
  패턴 병합 631ms → 40ms. grep 프로세스 15개 → 7개.
  **캐시(제안 2)는 하지 않았다.** fork 를 없앤 뒤 남은 1.0초의 내역은 bash 프로세스 2개
  시작 + common.sh·detect-stack source + 팩 6개 파일 읽기 + grep 7개다. 캐시가 가져갈
  수 있는 몫은 그중 약 0.27초뿐인데, 캐시가 틀리면 보호 목록이 낡아 가드가 **덜 막는**
  쪽으로 틀린다. 0.27초와 그 위험을 바꾸지 않았다 — fork 제거가 위험 없이 1.3초를 줬다.
  남은 0.27초를 캐시로 가져갈지는 사람 결정으로 남긴다(제안 2는 열린 상태다).
recurrence_risk: high
harness_element: HE-10
proposed_harness_change: "(적용됨, 2026-10-11) (1) `scripts/guard-protected.sh` 의 `json_field` 를 **한 번의 추출**로 바꾼다 — 적용. 보호 파일이 아니다. (2) 번들 가드(`harness/hooks/*`, 보호 파일)와 `harness/scripts/lib/detect-stack.sh` 의 fork 를 없앤다 — 적용. **캐시는 넣지 않았다**: 측정이 가리킨 것은 재계산이 아니라 fork 였고, 캐시로 남는 몫은 0.27초인데 캐시가 틀리면 보호 목록이 낡아 가드가 덜 막는다. 캐시를 쓰려면 캐시 키가 틀렸을 때 전량 재계산으로 떨어지는 설계만 받는다(열린 상태). (3) 어느 쪽도 '빠른 경로' 로 판정을 건너뛰지 않는다 — 적용된 변경은 같은 입력에서 같은 판정을 내며, 보호 목록 80개가 글자까지 같다는 것을 테스트가 고정한다. 비용이 아니라 검출력이 이 훅의 존재 이유다"
preferred_enforcement: hook
trust: untrusted
regression_check: |
  대상: 2026-10-11 적용분. 1회 수행 완료.
  (a) 기존 판정 테스트 전부 통과 — `test_guard_protected.py` 12건,
  `test_guard_docker_volumes.py` 19건, `test_guard_eval_blind.py` 22건 = 53/53.
  (b) 변이 주입 3건 전부 검출(비용과 검출력을 바꾸지 않았다는 확인):
      1. 언어 팩의 `.importlinter` 패턴을 바꿈 → `test_blocked_pattern_list_is_unchanged`
         실패. 2. 코어의 `harness.config` 패턴을 바꿈 → 6건 실패(차단 테스트 포함).
      3. 한 번의 추출에서 값의 경계를 틀리게 함(`${rest:1:${#rest}-2}` → `${rest:1}`)
         → 9건 실패. 이 셋은 각각 "팩 목록이 줄어듦", "코어 목록이 줄어듦",
         "추출이 조용히 틀림" 에 대응한다.
  (c) `echo hello` payload 소요: 2.24초 → **1.01초**. 당초 기준은 1초 미만이었고 지금은
      그 경계값이다. 남은 1초는 캐시로만 더 줄어들고(약 0.27초) 그 위험을 받지 않았으므로,
      기준을 못 맞춘 것이 아니라 **기준을 바꾼 것**으로 적는다 — 1초를 받아들인다.
  (d) 캐시를 넣지 않았으므로 캐시 키 어긋남 확인은 해당 없음. 대신 (b)-1·2 가 "보호
      목록이 낡으면 테스트가 실패한다" 를 같은 자리에서 보증한다.
  새로 고정한 것(tests/scripts/test_guard_hook_cost.py, 8건):
    - 차단 패턴 80개와 경고 패턴 71개의 **목록 전체**(수정 직전 실제 출력).
      이 목록에는 테스트가 하나도 없었다 — 비용을 줄이는 변경에서 정작 지켜야 하는 것이다.
    - 패턴 병합 비용을 **fork 1회 비용의 배수**로 판정한다(절대 ms 로 재면 Windows 와
      Linux 에서 임계가 달라진다). 수정 직전 fork 50회분 → 지금 1~4회분.
    - `echo hello` 한 줄이 가드 사슬 전체에서 띄우는 grep 프로세스 수 7개(내역을 주석에
      적었다). 남은 4개는 "무엇을 고치려는 명령인가" 를 보는 판정이라 줄이지 않는다.
  남은 반대 확인: Linux(CI) 에서 fork 가 싼 환경의 임계 여유를 1회 관측한다.
owner: showjihyun
