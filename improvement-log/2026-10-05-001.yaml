# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-10-05-001
date: 2026-10-05
status: validating
symptom: 가드가 명령문에 보호 경로 문자열이 있으면 위치를 보지 않고 차단한다. 그래서 보호된 스크립트를 **실행**하는 정상 명령이 막히고, 매번 명령을 쪼개 다시 실행해야 했다
evidence: |
  이 세션에서 3회. (a) 개선 후보를 고치는 python 편집과 보호된 로그 스크립트 실행이 한 명령에
  섞였을 때, (b) 같은 조합을 다시 시도했을 때, (c) 가드 자체를 고치는 패치 명령이 **주석 안에
  적힌 보호 경로** 때문에 막혔을 때. (c)는 특히 분명한 오탐이다 — 그 명령은 보호 경로를 읽지도
  쓰지도 않고 문자열로만 담고 있었다.
  더 앞선 같은 부류: `cp .harness/verify.json <저장소 밖>`(읽기만 하는 복사)와
  `sed -i ... improvement-log/<id>.yaml && <보호된 스크립트> validate` 가 차단되어 우회 경로로
  다시 실행했다(후보 2026-09-23-001 의 근거에 기록됨).
  비용은 매번 1~2분이고, 더 나쁜 것은 명령을 쪼개는 습관이 들면서 한 번에 확인할 수 있는 것을
  여러 번에 나눠 실행하게 된다는 점이다.
root_cause: 판정 입력이 '명령문에 그 문자열이 있는가' 였다. 셸에서 경로는 실행 대상·읽기 대상·쓰기 대상·단순 문자열 중 무엇이든 될 수 있고, 그중 쓰기만이 보호의 대상이다
fix: 프로젝트 래퍼(scripts/guard-protected.sh)에 실행 위치 예외를 넣었다. 각 명령 구획의 첫 토큰(환경변수 대입과 bash·sh·uv·source 류 래퍼를 건너뛴 뒤)만 실행 위치로 보고 분류에서 제외하며, 쓰기 위치의 보호 경로가 하나도 없으면 래퍼가 직접 허용하고 그 사실을 로그에 남긴다. 번들 가드는 건드리지 않았다
recurrence_risk: medium
harness_element: HE-10
proposed_harness_change: "적용 완료(2026-10-05). 실행 위치 예외는 래퍼에만 둔다 — 번들은 상류 자산이므로 고치지 않는다. 남은 오탐 부류: 읽기 전용 명령의 인자(`cat`·`cp` 의 원본 등). 그것까지 넓히려면 명령 파싱이 깊어져 가드 자체가 신뢰하기 어려워지므로, 다음 사례가 쌓인 뒤에 판단한다. 그 전까지는 스크래치패드 스크립트로 우회한다(이미 쓰는 방법)"
preferred_enforcement: script
trust: untrusted
regression_check: |
  2026-10-05 실측(적용 뒤) — 프로브 7건:
    허용: 보호된 스크립트 실행, 그 실행과 무관한 파일 편집이 섞인 명령, bash 래퍼로 실행
    차단: 리다이렉트로 보호 파일 덮어쓰기, sed -i 로 보호 파일 수정, cp 로 덮어쓰기, >> 로 덧붙이기
  tests/scripts/test_guard_protected.py 에 4건을 더해 그 경계를 고정했다(총 12건 통과).
  남은 확인: 다음 라운드에서 가드 오탐이 0건인지. 1건이라도 나오면 그 명령 모양을 근거에 더한다.
owner: unassigned
