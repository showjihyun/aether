  대상: 제안 적용 뒤 harness.yml 실행 30회, 그리고 REP-8 의 N+1 시드.
  기준: 제품 코드 변경이 없는 실행에서 bench 실패 0건. N+1 시드를 넣은 트리는 여전히 bench 에서 실패(두 측정 모두 초과).
  적용 확인(2026-09-24): 기준을 1 ms 로 낮춘 임시 설정으로 기본 재측정 경로를 실제로 돌렸다 —
  1차 36.77 ms, 재측정 35.27 ms(실제 smoke.sh --bench, 41초), 둘 다 초과여서 2회 연속 초과로 실패했다.
  잡음 한 번으로는 통과하지 않고 실제 초과는 두 번 잡힌다는 뜻이다. 전체 verify 18/18 통과.
  남은 확인: CI 30회에서 제품 변경 없는 bench 실패 0건.
  재측정 명령은 HARNESS_BENCH_REMEASURE_CMD 로 덮어쓸 수 있고(테스트용), 그 변수를 켜고 도는 실행은
  게이트를 약화시키는 것이므로 명령 로그에서 드러난다.
