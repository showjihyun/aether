symptom: 재설계한 REP-4 기준이 blind 실행자가 알 수 없는 산출물 규약을 요구한다. 근거를 `infra/docker/out/` 에 파일로 남기라는 요구가 입력에는 없고 문서 어디에도 없어, 성실하게 라이브 관측을 한 실행도 세 줄을 미충족으로 남겼다
evidence: |
  evaluation/runs/2026-09-20-REP-4-r3.md: 실제 Redis·Postgres(testcontainers) + 실제 uvicorn 으로
  프로덕션 기본값 15초 keep-alive 를 측정(간격 14.98·15.00·15.00)했으나, 근거를 보고 안 수치로만 제시하고
  임시 스크립트를 삭제. infra/docker/out/ 에 새 파일 0건, 전사에서 그 경로 언급 0회.
  같은 task 의 직전 실행(2026-09-17-REP-4-r2.md)도 같은 줄에서 미충족이었다 — 그때는 이벤트 소스도 가짜였다.
  두 실행 모두 blind(평가 문서 참조 0건)였으므로 실행자는 기준 문구를 볼 수 없었다.
root_cause: 합격 기준이 "어디에 무엇을 남길 것인가" 라는 산출물 규약을 담고 있는데, 그 규약이 실행자에게 전달되는 경로(입력 문장 또는 저장소 문서)가 없다. 측정하려는 것은 실동작 관측이지 파일 배치 관습이 아니다
fix: 이번 실행을 fail 로 기록했다. 기준은 그대로 두고 이 후보가 입력 쪽 보완을 제안한다
