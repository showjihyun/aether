# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-10-18-004
date: 2026-10-18
status: candidate
symptom: 화면 둘을 만들고 판정 전량을 통과시켰는데, 그 화면들은 실제 스택에서 401 이다. SDK 를 가짜로 바꾼 단위 테스트는 그것을 볼 수 없다
evidence: |
  2026-10-18, MVP-2a·2b. `/agents`·`/runs`·`/runs/{id}` 세 화면이 `web-unit`·`web-arch`·
  `web-build` 와 전량 verify 를 통과했다. 그런데 세 화면 모두 `createClient({ baseUrl })` 만
  부르고 **API 키를 넘기지 않는다**:
    apps/web/app/agents/page.tsx:18     createClient({ baseUrl: ... })   # apiKey 없음
    apps/web/app/runs/page.tsx:21       createClient({ baseUrl: ... })   # apiKey 없음
    apps/web/app/runs/[id]/page.tsx:27  createClient({ baseUrl: ... })   # apiKey 없음
  api 는 `/healthz` 와 OpenAPI 문서를 뺀 모든 경로에 `Authorization: Bearer` 를 요구한다
  (spec 0001 2.9). `listings.py` 는 `require_principal` 을 쓴다. 그러므로 실제 스택에서 세
  화면은 **DESIGN 7절의 오류 상태**를 보인다. 홈 화면만 동작하는데 그것은 `/healthz` 라서다.
  **아무 단계도 이것을 보지 못한다.** `web-unit` 은 `vi.mock("@aether/sdk")` 로 SDK 를
  대체하므로 인증 경로가 아예 없다. `api-integration` 은 api 만 본다. `smoke` 는 web 을
  띄우지 않는다(spec 0005 D-16). 즉 "화면이 실제 데이터로 뜬다"(spec 0006 R-5)를 **지금
  판정하는 단계가 없다** — `e2e`(MVP-4)가 처음 본다.
  예고는 있었다. spec 0002 **C-4** 가 "브라우저 화면이 SSE 를 직접 열어야 하는 시점
  (MVP-2 이전)에 인증 변경이 필요하고 그것은 사람 결정" 이라고 적고 "MVP-2 전" 이라는
  기한까지 붙였다. 그 기한이 지났는데 아무도 꺼내지 않았고, 단위 셋이 초록으로 통과했다.
  C-4 는 SSE 만 말했지만 실제 공백은 더 넓다 — **서버 렌더 목록도** 키가 없다.
root_cause: 화면의 판정이 전부 SDK 를 가짜로 바꾼 단위 테스트다. 가짜는 인증·네트워크·CORS 를 통과한 척하므로, 실제로 데이터가 오는지는 단 한 단계도 묻지 않는다. 그리고 기한이 붙은 열린 결정(C-4, "MVP-2 전")을 그 단위 시작 시점에 확인하는 장치가 없다
fix: |
  이번에는 **고치지 않고 사람에게 올렸다.** 인증·비밀값에 닿는 변경은 진행하지 않는다
  (AGENTS.md Loop). 화면과 500 수정은 그대로 보내고, "실제 스택에서 401 이다" 를 보고와
  PR 에 **미측정이 아니라 알려진 결함**으로 적었다. R-5 를 통과했다고 적지 않았다.
recurrence_risk: high
harness_element: HE-3
proposed_harness_change: "(제안, 사람 결정) 둘. (1) **기한이 붙은 열린 결정을 단위 시작 때 보게 한다** — spec 의 제약 표에서 \"MVP-2 전\" 처럼 기한이 적힌 🔒 항목을 모아 그 단위에 들어갈 때 드러내는 검사. 지금은 사람도 에이전트도 그것을 다시 읽지 않는다. (2) **화면의 판정에 가짜가 아닌 한 줄을 넣는다** — MVP-4 의 e2e 가 네 경로를 실제로 열어 401 이 아님을 단언하기 전까지, 화면 단위는 \"실제 데이터로 뜬다\" 를 주장하지 않는다는 것을 명시한다. (2) 는 plan 쪽 서술이고 (1) 이 하네스 변경이다. 둘 다 harness/** 또는 .claude/ 라 사람이 커밋한다"
preferred_enforcement: test
trust: untrusted
regression_check: |
  MVP-4 의 `e2e` 가 네(다섯) 경로를 실제 스택에서 열어 **401 이 아니고 행이 보이는지**
  단언할 때 이 후보를 다시 본다. 그때까지 MVP-2c 가 화면을 더 만들면 같은 결함이 늘어나는
  것이므로, 2c 보고에도 같은 문장을 적는다. 인증 결정이 먼저 오면 (2) 는 필요 없어지고
  (1) 만 남는다.
owner: showjihyun
expires: none
