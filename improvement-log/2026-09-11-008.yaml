# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-09-11-008
date: 2026-09-10
status: candidate
symptom: .dependency-cruiser.cjs 의 options.tsConfig.fileName 에 상대 경로 "apps/web/tsconfig.json" 을 두었더니, dependency-cruiser 18 이 이 값을 TypeScript 의 parseJsonConfigFileContent 다섯 번째 인자로 그대로 넘겨 include 가 0건 매치되어 TS18003 오류로 죽었습니다.
evidence: |
  git show 75da790 diff: "-    tsConfig: { fileName: \"apps/web/tsconfig.json\" },\n+    tsConfig: { fileName: require(\"node:path\").resolve(__dirname, \"apps/web/tsconfig.json\") },".
  plans/0001-phase-0-foundation.md 부록 E 주석: "절대 경로여야 합니다. dependency-cruiser 18 은 이 값을 TypeScript 의 parseJsonConfigFileContent 5번째 인자로 그대로 넘기고, 상대 경로면 include 가 0건 매치해 TS18003 으로 죽습니다(P0-3 에서 확인)."
root_cause: dependency-cruiser 의 tsConfig.fileName 문서가 상대·절대 경로 둘 다 받는 것처럼 보이지만, 내부적으로 TypeScript API 에 넘길 때 그 값을 기준 디렉터리 인자로 재사용하는 구현 세부사항이 문서화되어 있지 않았고, plan 부록 E 를 처음 작성할 때 이를 확인하지 않았습니다.
fix: 사람이 .dependency-cruiser.cjs 의 tsConfig.fileName 을 require("node:path").resolve(__dirname, ...) 로 절대 경로화했습니다(H-1 후속 2).
recurrence_risk: low
harness_element: HE-7
proposed_harness_change: 보호 파일 부록(plan 의 부록 A~G)에 외부 도구의 경로 인자를 적을 때는 "상대·절대 어느 쪽이 실제로 동작하는지 첫 실행에서 확인" 을 부록 작성 체크리스트에 명시하고, 확인 전 상태는 "# 확인" 표시를 유지합니다(이미 다른 항목에 적용된 관행).
preferred_enforcement: doc
trust: untrusted
regression_check: |
  대상: REP-1(계층 경계를 지키는 기능 추가, Phase 0 완료 후 실행 가능 — web-arch 단계 포함)
  기준: pnpm exec depcruise apps/web --config .dependency-cruiser.cjs 가 TS18003 없이 계속 exit 0.
  근거 파일: .dependency-cruiser.cjs, .harness/logs/web-arch.log
owner: unassigned
expires: 2026-12-10
