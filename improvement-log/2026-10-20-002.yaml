# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-10-20-002
date: 2026-10-20
status: candidate
symptom: 변이 테스트를 되돌리려고 `git checkout <파일>` 을 써서 **커밋하지 않은 수정 전부를 날렸다.** 같은 실수가 두 번째다
evidence: |
  2026-10-20, Quickstart 마찰 수정(F-1 ~ F-9). `docs/quickstart.md` 에 여덟 건을 고친 뒤
  새 드리프트 테스트의 변이 검증을 하려고 0절 표에서 `openssl` 행을 지웠다. 테스트가
  의도대로 실패했고(검증 성공), 그 변이를 되돌리기 위해 `git checkout docs/quickstart.md`
  를 실행했다. 그 파일은 **아직 커밋되지 않았고**, 따라서 되돌아간 것은 변이 하나가 아니라
  **여덟 건 전부**였다:

      $ grep -c "openssl\|PowerShell\|docker compose ps\|--project" docs/quickstart.md
      1
      $ git status --short
       M tests/scripts/test_quickstart.py        # 문서 쪽 수정은 흔적도 없다

  탐지는 우연에 가까웠다 — 복구 직후 돌린 테스트가 2건 실패로 되돌아갔고, 그 숫자가
  변이 전과 같아서 알아챘다. 테스트를 돌리지 않았으면 그대로 커밋됐을 것이다.

  **1차 발생**: 2026-10-19, MVP-5 (PR #177). `tests/scripts/test_quickstart.py` 의 변이를
  되돌리려고 같은 명령을 써서 `_git_ignores` 수정(그 PR 의 CI 실패를 고친 바로 그 코드)을
  날렸다. 그때는 `grep -c "_git_ignores"` 가 0 을 돌려 탐지했고, `improvement-log/
  2026-10-20-001` 의 evidence 에 사건은 적혔지만 **이 실수 자체를 후보로 남기지 않았다.**
  남기지 않은 것이 두 번째 발생의 조건이었다.
root_cause: |
  `git checkout <파일>` 은 "내 변이를 지워라" 가 아니라 "그 파일을 HEAD 로 되돌려라" 다.
  작업 트리에 **커밋 전 수정**이 있으면 변이와 수정이 한 덩어리로 사라지고, git 은 묻지도
  경고하지도 않는다(복구 수단도 없다 - stash 도 reflog 도 걸리지 않는다).

  변이 검증은 **구조상 커밋 전에** 한다(그 수정이 테스트를 통과시키는지가 검증 대상이므로).
  즉 이 명령은 변이 검증 중에 **항상 위험하고**, 위험이 가장 큰 순간에 가장 손이 간다.
fix: |
  변이 검증의 되돌리기를 git 에 맡기지 않는다. 변이 **직전에** 파일을 scratchpad 로
  복사하고(`cp <파일> $SCRATCH/x.bak`) 끝나면 그 사본으로 되돌린다(`cp $SCRATCH/x.bak
  <파일>`). 이번에 F-2 테스트의 변이 검증을 그 방식으로 했고 정상 동작했다:

      변이: 4절의 ps 줄 삭제 -> 1 failed, 9 passed
      복구(cp) -> 10 passed

  2026-10-19 의 1차 발생 때 쓴 복구(백업 파일에서 되살리기)와 같은 수단이다. 차이는
  **사고 후 복구가 아니라 사고 전 준비**로 쓴다는 것뿐이다.
recurrence_risk: high
harness_element: HE-3
proposed_harness_change: "(제안, 사람 결정) 같은 실수가 두 번 났고 둘 다 탐지가 우연이었다. 가장 싼 쪽은 `scripts/` 에 변이 검증용 보조 하나를 두는 것이다 - `scripts/mutate.sh <파일> <명령>` 이 백업 -> 변이 -> 명령 실행 -> 무조건 복구를 수행하고 종료 코드를 그대로 돌려준다(git 을 전혀 쓰지 않는다). 더 센 쪽은 로컬 훅이 `git checkout`/`git restore` 의 대상 파일에 커밋 전 수정이 있으면 막는 것인데, 정당한 사용(진짜로 되돌리고 싶을 때)까지 막아 잡음이 크다. 어느 쪽이든 `harness/**` 또는 `scripts/**` 이고 사람이 커밋한다"
preferred_enforcement: script
trust: untrusted
regression_check: |
  다음 변이 검증에서. `git checkout`·`git restore` 로 변이를 되돌리는 순간이 재발이다 -
  그때 작업 트리에 커밋 전 수정이 있으면 같은 손실이 반복된다.
owner: showjihyun
expires: none
