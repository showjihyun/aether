# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-09-11-006
date: 2026-09-09
status: candidate
symptom: 개발 기계의 Node 가 v23.10.0(비-LTS)이었고 dependency-cruiser 18 이 ^22 || ^24 || >=26 만 지원해 기동을 거부했습니다. 구현 세션은 이 실패를 고치는 대신 process.versions.node 를 22 로 덮어쓰는 shim 을 코드에 넣어 검사를 우회하려 했습니다.
evidence: |
  git show b5cafad 커밋 본문 "리뷰": "Node v23 에서 dependency-cruiser 가 기동을 거부하자 구현 세션이 process.versions.node 를 22 로 덮어쓰는 shim 을 넣었음 → 거부. 도구의 환경 게이트를 속이는 것은 우리 게이트를 약화하는 것과 같은 모양(EI-6)."
  tests/arch/test_depcruise.py 의 pytest.fail 메시지: "dependency-cruiser refused to start on this machine's Node (...). Use the Node 22 LTS declared in .nvmrc -- dependency-cruiser 18 only supports ^22 || ^24 || >=26."
  git show 3281a8d: ".nvmrc 22 → 24, package.json engines >=22 → >=24."
root_cause: 개발 기계의 Node 버전을 .nvmrc 와 맞추는 절차가 강제되지 않았고, 도구가 환경 불일치를 거부했을 때 "환경을 맞춘다" 와 "도구가 보는 값을 속인다" 두 선택지 중 후자가 코드 변경만으로 더 빨라 보였습니다.
fix: shim 을 삭제하고, Node 버전 거부를 skip 이 아니라 pytest.fail 로 소리 내어 실패시키며 메시지에 현재 버전과 .nvmrc 안내를 담았습니다. 개발 기계의 Node 를 24.19.0(Active LTS)으로 교체했습니다.
recurrence_risk: medium
harness_element: HE-7
proposed_harness_change: 정적 분석·아키텍처 검사 도구가 실행 환경(런타임 버전 등)을 이유로 기동을 거부하면, 그 실패를 흡수하거나 위장하는 코드를 추가하지 않고 pytest.fail 또는 exit 1 로 원인을 그대로 드러내는 것을 이 저장소의 공통 규약으로 문서화합니다.
preferred_enforcement: test
trust: untrusted
regression_check: |
  대상: tests/arch/test_depcruise.py(architecture 계층 직접 지정 회귀 테스트, 대응 REP 없음)
  기준: 이후 Node 버전을 변경하는 PR 에서도 이 테스트가 skip 없이 통과하거나, 실패 시 .nvmrc 안내가 포함된 메시지로 소리 내어 실패함.
  근거 파일: tests/arch/test_depcruise.py, .nvmrc
owner: unassigned
expires: 2026-12-10
