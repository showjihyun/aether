id: 2026-10-09-002
date: 2026-10-09
status: candidate
symptom: 적재가 청크마다 임베딩을 한 번씩 부른다 — `embed([하나])` × 청크 수. 배치 호출이 없어서 문서가 커질수록 임베딩 서버 왕복이 선형으로 늘고, 그 왕복이 적재 시간의 대부분이 된다
evidence: |
  2026-10-09 P3-2b 보고의 "불일치 3": 청크마다 `embed([단일 텍스트])` 를 호출하도록 구현했고
  배치를 쓰지 않았다. spec 0004 는 배치 여부를 정하지 않았다(2.4 가 네 단계만 적는다).
  포트는 이미 배치를 받을 수 있는 모양이다 — `ModelGateway.embed(texts: list[str])`(spec 0002 2.5,
  P1-3 이 만든 시그니처)이고 OpenAI 호환 `/embeddings` 도 `input` 에 배열을 받는다.
  즉 구조는 준비돼 있고 부르는 쪽이 하나씩 보내고 있다.
  아직 비용을 재지 않았다 — 로컬 LLM 실제 임베딩 확인이 미측정이고(spec D-13, 사람 몫) 그래서
  왕복 1회의 실제 지연을 모른다. 그 숫자가 이 후보의 전제다.
root_cause: 적재 유스케이스가 청크 목록을 순회하며 한 건씩 부른다. 포트가 배치를 허용하는데 호출자가 그것을 쓰지 않는다 — 설계가 아니라 구현의 선택이고, spec 이 정하지 않아 그렇게 됐다
fix: 이번에는 범위 안으로 받아들이고 기록만 했다. 배치로 바꾸는 것은 측정 뒤에 판단한다
recurrence_risk: medium
harness_element: HE-6
proposed_harness_change: "(사람 결정) 먼저 **측정**한다 — 로컬 LLM 으로 임베딩 1회 왕복 지연을 재고(spec D-13 의 사람 확인과 같은 자리), 청크 100개 적재의 전체 시간 중 임베딩 왕복이 차지하는 비중을 본다. 그 비중이 크면 배치 크기를 설정값(`AETHER_EMBED_BATCH`, 기본 16 정도)으로 두고 유스케이스가 묶어 부르게 한다. 배치는 **실패 처리**를 바꾼다 — 한 배치가 실패하면 그 안의 어느 청크가 문제인지 모르므로, 실패 시 1건씩 재시도하는 경로가 필요하다. 그 복잡도를 측정 없이 들이지 않는다"
preferred_enforcement: script
trust: untrusted
regression_check: |
  대상: 배치를 넣은 경우 적재 1회(청크 100개 이상).
  기준: 임베딩 호출 수가 청크 수가 아니라 ceil(청크 수 / 배치 크기) 다. R-6 의 단언은
  "호출 수 = 청크 수" 에서 "임베딩된 텍스트 수 = 청크 수" 로 바뀐다(같은 것을 보되 배치를 허용).
  한 배치가 실패하면 그 배치의 청크만 1건씩 재시도하고, 그 경로를 테스트가 덮는다.
  적재 전체 시간이 측정에서 드러난 비중만큼 줄어든다.
owner: unassigned
expires: 2027-01-09
