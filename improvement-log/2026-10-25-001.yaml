# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-10-25-001
date: 2026-10-25
status: candidate
symptom: >-
  PreToolUse 보호 가드의 셸 검사가 **위험도와 반대 방향으로** 걸립니다. 가드는 명령
  문자열에서 변경 구문(`>`/`>>`, `tee`, `sed -i`/`perl -pi`, `cp`/`mv` 류)이 겨냥하는
  토큰만 뽑아 보호 패턴과 맞춥니다. 그래서 두 종류의 오류가 같은 세션에 나왔습니다.
  (a) **빠뜨림** — 인터프리터를 띄워 그 안에서 파일을 여는 경로(`python - <<PY` +
  `io.open(path, "w")`, node·ruby 등)는 명령 문자열에 보호 파일 이름이 그대로 들어
  있어도 통과합니다. (b) **과잉** — 명령에 `sed -i` 가 있으면 경로처럼 보이는 토큰을
  전부 훑으므로, `sed -i` 의 대상이 보호 파일이 아니고 보호 파일 이름이 **다른 파일에
  쓸 산문 안에만** 등장해도 차단됩니다.
evidence: >-
  2026-10-25, 주 세션(H-2 작업). `.harness/guard-events.log` 의 같은 파일
  (`harness.config`)에 대한 세 줄과 그날의 차단 1건:
  (1) `2026-10-24T03:32:59Z  block  harness.config  셸 명령` — scratchpad 로
      **복사**하려던 `cp`. 내용 변경 없음. 차단됨.
  (2) `2026-10-24T03:52:19Z  block  .../harness.config  파일 편집` — Edit 도구. 차단됨.
  (3) `2026-10-25T06:39:53Z  change harness.config  내용이 바뀌었습니다` —
      **실제로 11줄을 더한 python heredoc. PreToolUse 차단 없음**, 사후 탐지기만
      기록. `HARNESS_ALLOW_GUARDED_EDIT=1` 을 쓰지 않았습니다(쓸 필요가 없었습니다).
  (4) 같은 날, 이 후보 파일(`improvement-log/`, 보호 대상 아님)을 채우는 명령이
      차단됨 — 명령에 `sed -i improvement-log/...` 가 있었고 보호 파일 이름은
      heredoc **산문 안에만** 있었습니다. 즉 (3) 은 바꿨는데 통과, (4) 는 바꾸지
      않았는데 차단입니다.
  가드 본문의 자기 주석(`harness/hooks/guard-evaluation-tampering.sh` 282~300행)이
  한계를 "완전한 셸 파서가 아니므로 우회는 여전히 가능합니다 … 실수와 손쉬운
  지름길을 막는 것" 으로 적어 두었습니다. 다만 **인터프리터 heredoc 은 에이전트가
  파일을 고칠 때 가장 흔히 쓰는 수단**이므로 "손쉬운 지름길" 쪽에 속합니다.
root_cause: >-
  가드가 "무엇을 바꾸는가" 를 **셸 수준 변경 구문의 열거**로 근사합니다. 그 열거는
  셸이 직접 파일을 여는 경우만 담고, 셸이 **다른 프로그램에게 파일을 열게 하는**
  경우는 담지 않습니다. 인터프리터는 닫힌 열거가 불가능한 집합입니다. 반대편에서는
  `sed -i` 분기가 정밀도를 포기하고 모든 토큰을 보므로, 같은 근사가 한쪽에서는
  빠뜨리고 다른 쪽에서는 넘칩니다.
fix: >-
  이 세션에서는 고치지 않았습니다. (3) 은 사람이 명시적으로 승인한 변경이어서 결과가
  의도대로였고, 사후 탐지기(`detect-guarded-change.sh`)와 CI 의 `harness-change`
  라벨은 그대로 작동했습니다 — **강제력 있는 층은 뚫리지 않았고 뚫린 것은 빠른
  피드백 층입니다.** (4) 는 명령에서 `sed -i` 를 빼서 우회했는데, 그것이 바로 이
  후보가 지적하는 모양입니다.
recurrence_risk: high
harness_element: HE-10
proposed_harness_change: >-
  둘을 제안합니다. 가드 스크립트는 보호 대상이므로 사람이 커밋합니다.
  (1) 셸 검사에 **인터프리터 휴리스틱**을 더합니다 — 명령이
      `python`/`python3`/`node`/`ruby`/`perl`/`pwsh` 를 부르고 **동시에** 보호 패턴에
      걸리는 토큰을 포함하면, 변경 구문을 찾지 못해도 차단하고
      `HARNESS_ALLOW_GUARDED_EDIT=1` 을 요구합니다. 인터프리터는 읽기와 쓰기를
      구분할 수 없으므로 보수적으로 막습니다. 오탐이 늘지만 탈출구가 한 단어이고
      그 사용이 로그에 남습니다.
  (2) 열거로 닫히지 않는다는 사실을 인정하고, **보호 파일이 탈출구 없이 바뀐 것을
      관측했을 때 그 자리에서 경고를 띄웁니다**(지금은 로그만 남습니다).
  (1) 이 싸고 (2) 가 원리적입니다. 어느 쪽도 CI 의 라벨 게이트를 대체하지 않습니다.
  **(b) 의 과잉은 함께 고쳐야 합니다** — `sed -i` 분기가 `-i` 의 실제 인자만 보게
  좁히지 않으면, (1) 을 더하는 순간 "보호 파일을 문장으로 언급하는 모든 명령" 이
  막혀 후보·문서 작성이 매번 탈출구를 요구하게 됩니다.
preferred_enforcement: hook
trust: untrusted
regression_check: >-
  `tests/scripts/` 에 가드 단위 테스트를 더해 **세 경우를 한 테스트 안에서** 비교합니다.
  (1) 보호 파일을 겨냥한 `python - <<PY … io.open(p, "w") … PY` 는 **차단**된다
      — 지금 트리에서는 통과하므로 이것이 red 증거입니다.
  (2) 같은 파일을 `cat`/`grep` 으로 읽는 명령은 **통과**한다(읽기를 막지 않음).
  (3) 보호 파일 이름이 **다른 파일에 쓸 산문 안에만** 있고 `sed -i` 의 대상은 보호
      대상이 아닌 명령은 **통과**한다 — 지금 트리에서는 차단되므로 이것도 red 입니다.
