# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-10-10-002
date: 2026-10-10
status: candidate
symptom: PostgreSQL 이미지를 pgvector 로 교체한 비용(디스크 +226 MB, 압축 +46 MB)이 교체한 단위(P3-2a)에서 측정되지 않고 두 단위 뒤(P3-5)에 처음 측정됐다. Air-Gapped 번들 크기와 CI 의 이미지 당겨오기 비용이 제품 요구에 걸리는데도, 이미지 크기는 어느 단계에서도 기록되지 않는다
evidence: |
  spec 0004 C-6 은 "기존 PG 컨테이너를 pgvector 이미지로 교체하므로 컨테이너 수는 늘지
  않는다. 실측은 P3-2 에서 기록합니다(R-12)" 로 답했다. P3-2a 가 실제로 기록한 것은
  verify 합계 ms 이고 이미지 크기는 아니다 — "컨테이너 수" 는 쟀고 "컨테이너 크기" 는
  재지 않았다.
  2026-10-10 P3-5 에서 처음 측정(로컬 Docker):
    pgvector/pgvector:pg16  디스크 621 MB, inspect Size 156,098,403 B
    postgres:16-alpine      디스크 395 MB, inspect Size 109,995,527 B
  즉 디스크 +226 MB(+57%), 압축 크기 +46 MB(+42%).
  이 숫자는 CI 실행마다, 그리고 Air-Gapped 번들마다 실린다. `scripts/check-bench.sh` 와
  `bench` 단계는 지연·처리량만 보고 이미지 크기를 보지 않는다.
  로컬 이미지의 digest 가 compose 에 고정된 sha256 과 같은지는 확인하지 않았다 —
  측정값은 로컬 이미지의 것이다.
root_cause: 비용 판정의 축이 "개수" 에 맞춰져 있었다. 컨테이너를 늘리지 않는 교체는 통과로 읽히고, 같은 개수의 더 큰 이미지는 아무 단계도 보지 않는다. 그래서 결정 시점에 비용을 몰랐고, 알게 된 뒤에는 되돌릴 자리가 지나 있었다
fix: 이번에는 측정하고 기록만 했다(이 후보와 docs/step_results/p3-5.md). 교체 결정 자체는 pgvector 가 요구사항이므로 되돌리지 않는다
recurrence_risk: medium
harness_element: HE-11
proposed_harness_change: "(사람 결정) (1) `scripts/check-bench.sh` 또는 `bench` 단계가 compose 가 쓰는 이미지들의 크기 합계를 함께 기록하게 한다 — 임계값은 두지 않고 **기록만** 한다(EI-2: 임계값은 사람이 소유한다). (2) 기록이 쌓인 뒤에 Air-Gapped 번들의 상한을 사람이 정한다. 상한을 먼저 정하지 않는다 — 지금은 비교할 과거 값이 한 점뿐이다. (3) 이미지를 바꾸는 단위의 완료 판정에 '교체 전후 크기' 를 넣을지는 (1)의 기록이 실제로 쓰이는지 본 뒤에 판단한다"
preferred_enforcement: script
trust: untrusted
regression_check: |
  대상: (1)을 적용한 뒤 verify 3회.
  기준: `.harness/latest-bench.json`(또는 bench 가 쓰는 파일)에 이미지 크기 항목이
  나타나고, 세 번의 값이 같은 이미지에 대해 흔들리지 않는다. 임계값이 없으므로 이
  변경으로 실패하는 단계는 없어야 한다 — 실패가 생기면 (1)이 기록을 넘어 판정을
  하고 있다는 뜻이고, 그것은 이 후보의 범위가 아니다.
  반대 확인: 이미지 태그를 바꿔 크기가 달라지면 기록된 숫자도 달라진다(1회 확인).
owner: unassigned
expires: 2027-01-10
