proposed_harness_change: "(사람 결정) scripts/guard-eval-blind.sh 가 마커가 있는 동안 막는 경로를 evaluation/ 전체와 improvement-log/ 의 기존 항목 읽기로 넓힌다. improvement-log.sh(new·validate·list)와 새 항목 쓰기는 허용한다 — REP-7 합격 기준이 실행자에게 후보 1건 생성을 요구하기 때문이다. tests/scripts/test_guard_eval_blind.py 에 차단·허용 경우를 더한다. 추가(2026-09-24): 차단 메시지에 무엇이 여전히 허용되는지(새 후보 발급 improvement-log.sh new 와 새 파일 쓰기) 한 줄을 넣고 그 문구를 고정하는 테스트를 둔다 — 메시지가 없으면 실행자가 디렉터리 전체 금지로 읽는다. 평가자는 실행 전에 task ID 가 든 로컬 브랜치를 지운다(원격에 있어 복구 가능). 커밋 메시지·원격 브랜치 이름은 이 변경으로 막지 못하므로 기록의 한계로 적는다"
