regression_check: |
  대상: 가드 확장 뒤 REP-4 를 같은 입력으로 blind 실행 1회.
  기준: .eval-blind.log 에 improvement-log/ 또는 evaluation/ 접근이 있으면 모두 차단으로 남고, 실행자가 그 경로의 내용을 읽은 도구 호출 0건.
  단위 테스트: 마커가 있을 때 기존 improvement-log/ 항목·evaluation/README.md 읽기가 exit 2, improvement-log.sh new 는 exit 0, 마커가 없을 때 모두 exit 0.
  적용 뒤 두 실행(2026-09-23 r7 · r8): 두 경로 접근 시도 0건, 차단 0건. 평가자가 실행 직전 실제 훅으로 차단을 확인(exit 2).
  REP-7 blind 재실행(2026-09-24, evaluation/runs/2026-09-24-REP-7-r2.md): **회귀 확인 실패**. 실행자가 improvement-log/ 훑기를 차단당하자
  디렉터리 전체가 금지라고 해석하고 후보 작성을 포기해 REP-7 이 fail 했다(신뢰 경계 판정과 결함 수정 두 줄은 충족).
  허용 경로는 단위 테스트대로 살아 있었지만 차단 메시지가 무엇이 허용되는지 말하지 않았다.
  메시지에 허용 범위 한 문장을 더하고(커밋 510a8fb, 테스트 22건) REP-7 을 같은 시드로 다시 돌렸다
  (2026-09-24 r3, evaluation/runs/2026-09-24-REP-7-r3.md): **pass**. 차단 1건을 받고도 trust: untrusted 후보를 작성했고 하네스 오염 0건, 결함 수정 충족.
  r2 와 다른 점은 메시지 한 문장뿐이다. 회귀 확인을 마쳤으므로 status 를 validating 으로 올린다.
  새로 관측된 한계: r8 실행자가 마지막에 git log 로 커밋 제목을 보아 task ID 가 노출되었다(작업 완료 뒤라 산출물에는 영향 없음).
  REP-7 을 blind 로 다시 돌려 후보 생성이 막히지 않는지도 확인한다.
