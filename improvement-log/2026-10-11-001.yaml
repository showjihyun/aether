# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-10-11-001
date: 2026-10-11
status: candidate
symptom: CI 결과를 기다리는 폴링 루프가 이벤트를 하나도 내보내지 않은 채 만료됐다. 두 번 모두 CI 는 이미 끝나 있었고, 주 세션은 그 침묵을 "아직 안 끝났다" 로 읽을 수 있는 상태로 수십 분을 보냈다
evidence: |
  2026-10-10 PR #134: `gh pr checks 134` 를 폴링하는 루프를 30분 걸어 두었고 이벤트가
  0건으로 만료됐다. 직접 `gh pr checks 134` 를 부르자 세 검사가 모두 끝나 있었다.
  2026-10-11 PR #136: 같은 모양의 루프가 다시 30분 만료, 이벤트 0건. 직접 조회하니
  `verify` 가 4분 6초로 이미 pass 였다. 즉 두 번 모두 **신호가 아니라 관측이 없었다**.
  루프의 모양(두 번 같음):
    cur=$(gh pr checks N --json name,bucket | jq -r '... | "\(.name): \(.bucket)"' | sort)
    comm -13 <(echo "$prev") <(echo "$cur")
  실패 지점이 둘이다. (1) `comm` 은 **정렬된 두 입력**을 전제하는데 `prev` 는 첫 회차에
  빈 문자열이고 `echo ""` 는 빈 줄 하나를 내므로 비교가 어긋난다. (2) 루프 본문의
  어느 명령이 비영으로 끝나도 `set -e` 없이도 파이프라인 전체가 조용히 아무것도 내지
  않는다 — 오류가 stdout 에 나타나지 않으므로 이벤트가 생기지 않는다.
  두 경우 모두 사람이 보는 것은 "조용함" 하나이고, 그것은 "변화 없음" 과 구별되지 않는다.
  이 저장소 안에서 같은 교훈이 이미 한 번 적혔다 — docs/step_results/p3-5.md 는
  "모니터의 침묵은 변화 없음의 증거가 아니다" 를 보고 문장으로 남겼지만, 그 교훈이
  다음 실행의 절차를 바꾸지는 않았다(그래서 2회가 됐다).
root_cause: 대기 장치의 실패가 대기 중인 상태와 같은 모양(침묵)으로 나타난다. 폴링 루프는 자기 고장을 보고할 출력이 없고, 만료 통지는 "이벤트 0건" 만 알려 주며 그것이 정상인지 고장인지 구별하지 않는다
fix: 두 번 모두 사후에 `gh pr checks <N>` 을 직접 불러 상태를 확인하고 병합했다. 루프 자체는 고치지 않았다
recurrence_risk: high
harness_element: HE-15
proposed_harness_change: "(사람 결정) (1) PR 상태 대기는 폴링 루프를 손으로 쓰지 않고 `gh pr checks <N> --watch` 처럼 **끝나면 종료하는 명령**을 쓴다 — 종료 코드가 판정이므로 침묵이 결과를 대신하지 않는다. (2) 손으로 쓸 때는 매 회차에 **상태 한 줄을 반드시 출력**해 침묵 자체가 고장 신호가 되게 한다(변화가 없으면 `still pending` 을 낸다). (3) 어느 쪽이든 **병합 직전에 `gh pr checks` 를 한 번 직접 부른 결과를 근거로 쓴다** — 대기 장치의 출력은 근거가 아니다. 이 세 개는 절차이지 스크립트가 아니므로, `preferred_enforcement` 를 doc 으로 두고 AGENTS.md Loop 절이 아니라 docs/ 의 작업 절차 문서에 둘 자리를 사람이 정한다"
preferred_enforcement: doc
trust: untrusted
regression_check: |
  대상: 다음 PR 3건의 병합.
  기준: (a) 병합 전에 `gh pr checks <N>` 을 직접 부른 출력이 보고에 남아 있다.
  (b) 대기 장치가 만료했을 때 그 사실과 직접 조회 결과를 함께 적는다 — 만료를
  "변화 없음" 으로 적지 않는다. (c) 폴링 루프를 쓴 경우 회차마다 한 줄이 나온다.
  반대 확인: 일부러 깨진 폴링 루프(존재하지 않는 PR 번호)를 걸어 **이벤트가 나오는지**
  본다 — 나오지 않으면 (2)가 적용되지 않은 것이다(1회 확인).
owner: unassigned
expires: 2027-01-11
