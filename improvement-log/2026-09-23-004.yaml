# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-09-23-004
date: 2026-09-23
status: candidate
symptom: REP-4 의 합격 기준이 입력에 없는 산출물 규약을 요구한다. blind 실행자는 기준을 볼 수 없으므로 "한 캡처 안에 시작과 종료 이벤트" 와 "관측 방법 파일" 을 남길 이유를 알 수 없다. 기준을 읽은 실행(r6)은 pass, 읽지 못한 실행(r7)은 같은 질의 관측을 하고도 fail 이었다
evidence: |
  evaluation/runs/2026-09-23-REP-4-r7.md: 격리 compose(-p aether-keepalive-demo), 실제 Redis 스트림, 실제 curl, keep-alive 15.00초 ×3,
  응답 200, 실제 run_id 09076e85…. 미충족은 (1) 캡처에 run.finished 없음, (3) 방법 파일 없음. verify 18/18 은 실행자가 스스로 돌림.
  evaluation/runs/2026-09-22-REP-4-r6.md: 같은 수준의 관측에 종료 이벤트와 방법 파일이 있어 pass. 단 그 실행자는 improvement-log/2026-09-20-004.yaml 에서
  기준 세 줄을 읽었다(blind: partial). 두 실행의 차이는 관측이 아니라 기준을 알았는가였다.
  같은 뿌리의 첫 관측은 2026-09-20-002("조인 기준이 blind 실행자가 알 수 없는 산출물 규약을 요구함")이고, 그때 입력에
  "근거를 infra/docker/out/ 아래 파일로 남겨 제시하세요" 를 넣었다. 그 보완은 파일로 남기라는 것까지만 말하고 무엇을 담을지는 말하지 않는다. 2회째 관측이다.
  4차 기준으로 blind pass 는 아직 0건(09-17 r2 · r3 · r4 · r7 fail, r5 는 재채점 pass, r6 은 partial).
root_cause: 합격 기준은 채점자만 읽고 입력은 실행자만 읽는데, 기준이 관측의 질이 아니라 산출물의 형태까지 정하고 있다. 형태를 요구하려면 입력이 그 형태를 말해야 하고, 말하지 않으려면 기준이 형태를 묻지 말아야 한다
fix: r7 을 fail 로 기록하고 LB-3 에 따라 반복을 멈춘 뒤 사람 판단을 요청했다. 사람이 (a)를 골라 2026-09-23 에 입력만 개정했다(기준 세 줄은 그대로). 다음 blind 실행이 이 후보의 회귀 확인이다
recurrence_risk: high
harness_element: HE-14
proposed_harness_change: "(사람 결정) 셋 중 하나를 고른다. (a) 입력에 남길 산출물을 명시한다 — '관측 방법(어떤 스택에서 이벤트를 어떻게 만들었는지)을 적은 파일과, 한 Run 의 시작부터 종료까지가 담긴 캡처를 infra/docker/out/ 에 남기세요'. 검출력은 유지된다(가짜 이벤트 소스나 단일 프로세스는 여전히 기준 (1)에서 막힌다). (b) 기준을 관측만으로 판정하도록 줄인다 — 방법 파일 요구를 빼고 종료 이벤트 대신 '실제 Run 조회 응답 또는 캡처의 run_id 일치' 로 받는다. 실동작 증명은 약해진다. (c) REP-4 를 두 task 로 나눈다 — 실동작 관측(behavior)과 근거 제시(quality). 세트가 커지고 기준선을 다시 잡아야 한다. 추천은 (a)"
preferred_enforcement: doc
trust: untrusted
