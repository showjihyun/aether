# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-10-11-004
date: 2026-10-11
status: candidate
symptom: 필수 단계 `bench` 가 CI 에서 한 번 3배짜리 이상값으로 실패했다. 같은 커밋을 재실행하자 통과했다. 코드는 한 줄도 바뀌지 않았으므로 그 red 는 제품의 성능이 아니라 러너의 상태를 읽은 것이다. 재측정 장치가 있는데도 걸러지지 않았다 — 두 측정이 같은 나쁜 구간에 들어갔다
evidence: |
  2026-10-11, GitHub Actions 의 verify job 에서 관측한 p95(기준 150 ms):
    5a3a497 (main)        47.65 ms  통과
    d67f5f7 (PR #139)     51.57 ms  통과
    030fe5b (PR #140)     53.31 ms  통과
    030fe5b (PR #140, 2회) 65.60 ms  통과
    f37d435 (PR #140)    166.78 ms  **실패** → 재측정 166.93 ms, "초과(2회 연속)"
    f37d435 (재실행)       58.06 ms  통과
  중간값 약 54 ms, 이상값 166.8 ms = 약 3.1배. 기준 150 ms 는 중간값의 약 2.8배이므로
  이 이상값은 기준을 넘는다.
  f37d435 가 030fe5b 와 다른 것은 hooks/stop-verify-gate.sh, tests/scripts 의 테스트
  파일, improvement-log 의 yaml 셋뿐이다. 어느 것도 API 의 Run 생성 경로를 지나지
  않는다(훅은 CI 의 verify 에서 돌지도 않는다). 즉 코드 쪽 원인이 없다.
  scripts/check-bench.sh 는 초과 시 1회 재측정하고 "2회 연속" 일 때만 실패로 판정한다.
  그 장치가 작동했지만 걸러내지 못했다 — 두 측정이 같은 실행, 같은 러너, 거의 같은
  시점이라 상관되어 있다. 독립 표본이 아니다.
root_cause: 공유 러너의 성능 분산이 임계의 여유보다 크다. 그리고 재측정이 **같은 실행 안에서** 이뤄져 첫 측정과 상관되어 있으므로, 러너가 느린 구간에 들어간 경우를 가려내지 못한다. 분산이 큰 환경에서 단일 실행의 p95 를 필수 게이트로 쓰면 red 의 의미가 "제품이 느려졌다" 와 "러너가 느렸다" 로 갈라진다
fix: 재실행으로 통과시켰고 코드는 고치지 않았다. 임계값은 손대지 않는다 — 임계는 사람이 소유한다(EI-2)
recurrence_risk: medium
harness_element: HE-11
proposed_harness_change: "(사람 결정) 세 가지가 서로 배타적이다. (1) 판정을 **로컬에서만** 한다 — bench 를 HARNESS_DEFERRED_STEPS 에 두되 CI 에서는 측정만 하고 판정하지 않는다(required=false 로 내리는 것이 아니라, CI 용 임계를 따로 두거나 CI 에서 경고로 남긴다). 분산이 큰 쪽에서 판정을 떼는 것이다. (2) 재측정을 **독립 표본**으로 만든다 — 같은 실행 안의 연속 2회가 아니라, 실패 시 워크플로를 한 번 재실행해 두 실행의 결과가 모두 초과일 때만 red 로 본다. 지금의 '2회 연속' 은 상관된 표본이어서 이름만 2회다. (3) CI 용 임계를 러너의 실측 분산에서 정한다 — 중간값 약 54 ms, 관측 최대 166.8 ms 이므로 150 은 중간값의 2.8배이면서 관측 최대보다 작다. 이 숫자는 **사람이 정한다**(EI-2). 어느 쪽도 '느려졌을 때 알려주는 능력' 을 포기하지 않아야 한다 — 2026-09-17 에 Run 생성 경로의 N+1 이 verify 17/17 을 통과한 사건이 이 단계를 만든 이유다(improvement-log 2026-09-17-004). 기준을 올려서 조용하게 만드는 것은 그 사건을 되돌리는 것이다"
preferred_enforcement: script
trust: untrusted
regression_check: |
  대상: 다음 CI 실행 10건의 bench p95 를 모은다(지금 6건: 47.65 / 51.57 / 53.31 /
  58.06 / 65.60 / 166.78).
  기준: (a) 10건에서 150 ms 초과가 1건 이하이면 이 후보는 "드문 이상값" 이고 제안 (2)
  (독립 표본 재측정)만으로 충분하다. (b) 2건 이상이면 러너의 분산이 구조적이므로
  제안 (1) 또는 (3)이 필요하다 — 그때 숫자를 사람이 정한다.
  (c) 어느 경우에도 **로컬 측정**과 함께 본다. 로컬은 2026-09-16 실측 36.8 ms 이고
  이 세션의 로컬 bench 는 전부 통과했다. 로컬이 함께 올라가면 그때는 제품의 회귀다.
  반대 확인: p95 를 일부러 넘기는 변경(예: Run 생성에 sleep 추가)이 CI 에서 red 를
  내는지 1회 본다 — 임계를 건드리기 전에 "이 단계가 아직 검출력을 가진다" 를 확인한다.
owner: unassigned
expires: 2027-01-11
