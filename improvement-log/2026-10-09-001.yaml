# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-10-09-001
date: 2026-10-09
status: candidate
symptom: harness-scripts 단계가 verify 합계의 최대 비중을 차지한다 — 2026-10-07 실측 212.8초(86건), 2026-10-09 실측 358.8초, 2026-10-10 다섯 번 실측 219.8~303.6초(38% 변동). 2026-10-11 프로파일로 원인이 드러났다 — 테스트 수가 아니라 `verify.sh` 의 **시작 비용 38.5초**가 테스트 안에서 세 번 되풀이되는 것이다
evidence: |
  2026-10-07 api-unit 쪼개기 실측(improvement-log 2026-10-06-002): tests/scripts 261초(86건),
  tests/arch 31초(25건), 제품 테스트 전부 23초(413건). 즉 테스트 1건당 비용이 제품 테스트의
  약 50배다.
  2026-10-09 P3-2b 의 verify: harness-scripts 358.8초, 합계 736,213 ms 로 예산 600,000 ms 초과
  (선택 실패 1건). 그 단위는 tests/scripts 에 테스트를 더하지 않았으므로 증가분은 부하이거나
  복사 비용의 변동이다 — 어느 쪽이든 이 단계가 예산을 가장 크게 먹는다는 사실은 같다.
  2026-10-10 하루 동안 같은 저장소에서 이 단계가 다섯 번 측정됐다 — P3-4 에서 259.6초와
  303.6초, P3-5 에서 242.0초와 219.8초, Phase 3 완료 판정에서 261.4초. 테스트 수는
  그대로다. 즉 **같은 테스트가 84초(38%) 흔들린다**. 그 날의 합계는 각각 540,275 /
  592,021 / 530,333 / 491,515 / 545,184 ms 였고, 둘째 실행은 예산 600,000 ms 대비
  **여유가 8초**였다. 다섯째 실행에서는 이 단계가 합계의 48%를 차지했다. 비용의 절대값만큼 **변동폭**이
  문제다 — 예산 판정이 그 변동에 걸려 있으면 같은 커밋이 통과와 초과를 왕복한다.
  예산을 올리는 것은 사람의 결정이다(EI-2) — 올리면 '느린 것은 제품이 아니라 하네스
  자신' 이라는 사실이 가려진다.
  2026-10-11 테스트별 소요 실측(`pytest --durations`, 89건 합 240.9초):
    test_verify_lock.py      3건 146.4초 (50.9 / 50.7 / 44.8)  ← 합계의 61%
    test_guard_protected.py 12건 약 35초  (최대 6.9초)
    나머지 74건             약 59초
  첫 줄이 결정적이다. 그 세 건은 각각 `verify.sh --only syntax` 를 띄우는데, **락이 잡혀
  단계를 하나도 돌리지 않고 끝나는 첫 건도 44.8초**다. 즉 비용은 단계가 아니라 시작이다.
  단독 측정: 락을 잡아 둔 채 `verify.sh --only syntax` → 종료 코드 4, **38.6초**.
  `bash -x` 프로파일(38,379줄)에서 간격의 거의 전부가 `common.sh:185`
  `git -C … hash-object -- <파일>` 였다 — 801개 파일에 프로세스 801개다.
  읽기 전용 비교(2026-10-11): 같은 필터로 `git hash-object --stdin-paths` 를 한 번 부르면
  지문 값이 동일하고(code ca3f05f9… / docs 84c4bc09…) 소요는 38.8초 → 0.99초다.
  번들 복사(`_copy_bundle`, shutil.copytree)도 실재하지만 약 35초로 **두 번째**다.
root_cause: "[2026-10-11 정정] scope 지문(`harness_scope_fingerprint`, `harness/scripts/lib/common.sh`)이 **파일마다 `git hash-object` 프로세스를 하나씩 띄운다**. 이 저장소는 추적+비추적 801개 파일이고 Windows 의 프로세스 생성이 1건당 약 0.05초여서 지문 한 벌이 약 29초(code) + 10초(docs) = 38.5초다. 그 비용은 단계를 하나도 돌리지 않는 실행에도 든다. 처음 적은 '번들 전체 복사' 는 1순위가 아니었다 — 복사도 실재하지만 약 35초이고, 1순위는 중첩된 verify 시작 3회(약 115초)다. 비용을 줄이려고 넣은 기능(`--changed` 범위 판정, 2026-10-04-001)이 Windows 에서 비용의 최대 항목이 된 것이다"
fix: "아직 고치지 않았다 — 대상이 보호 파일(`harness/scripts/lib/*`)이라 사람이 커밋한다. 2026-10-11 에 같은 필터로 `git hash-object --stdin-paths` 를 **한 번만** 부르는 판을 만들어 읽기 전용으로 비교했다: 지문 값이 두 모드 모두 현재 구현과 **같고**(code `ca3f05f9…`, docs `84c4bc09…`), 소요는 38.8초 → 0.99초다. 패치는 proposed_harness_change 에 있다"
recurrence_risk: high
harness_element: HE-3
proposed_harness_change: "(사람 결정, 보호 파일 `harness/scripts/lib/common.sh`) (1) `harness_scope_fingerprint` 의 파일별 `git hash-object -- \"$p\"` 호출을, 같은 필터로 고른 경로 목록을 모아 `git hash-object --stdin-paths` 를 **한 번** 부르는 것으로 바꾼다. 지문 입력의 바이트 열(`경로\0해시\n`)을 그대로 유지하면 지문 값이 바뀌지 않는다 — 2026-10-11 에 읽기 전용 비교로 확인했다(code·docs 둘 다 동일). 경로에 줄바꿈이 있으면 `--stdin-paths` 가 갈라 읽으므로 그 경우에만 기존 루프로 떨어진다. (2) 그 뒤 `test_verify_lock.py` 의 세 건을 다시 측정한다 — 세 건 합이 146.4초였고 그중 약 115초가 (1)의 비용이다. (1)만으로 충분하면 테스트 구조는 건드리지 않는다. 남는 2순위는 `_copy_bundle`(약 35초)이고, 그것은 세션 범위 공유본 + 쓰기 테스트만 자기 복사본으로 줄일 수 있다 — (1) 뒤에 다시 재어 보고 판단한다. (3) 예산(600,000 ms)은 올리지 않는다(EI-2) — (1)이 합계를 약 130초 줄이므로 올릴 이유가 없고, 올리면 이 비용이 다시 보이지 않게 된다. 측정 없이 테스트를 지우는 것은 하지 않는다 — 검출력은 그대로 유지한다"
preferred_enforcement: test
trust: untrusted
regression_check: |
  대상: (1)을 적용한 뒤 verify 3회.
  기준: (a) `harness_scope_fingerprint` 의 두 모드 값이 적용 전과 같다(같은 작업 트리에서
  code `ca3f05f9…`, docs `84c4bc09…`). (b) `verify.sh --only syntax` 를 락이 잡힌 상태로
  돌렸을 때 38초대가 아니라 5초 미만에 종료 코드 4 로 끝난다. (c) harness-scripts 단계의
  소요가 260초대에서 130초대로 내려간다. (d) tests/scripts 의 테스트 수는 89건 그대로다 —
  검출력을 비용과 교환하지 않았다는 확인.
  반대 확인: 파일 하나를 고치면 지문이 바뀌고 `--changed` 가 code 범위를 다시 고른다(1회).
  경로에 줄바꿈이 있는 파일을 하나 만들어 fallback 경로가 도는지 본다(1회).
owner: unassigned
expires: 2027-01-09
