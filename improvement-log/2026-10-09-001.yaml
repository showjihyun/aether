# improvement log 후보입니다. improvement-log/schema.md 의 키 순서를 바꾸지 않습니다.
id: 2026-10-09-001
date: 2026-10-09
status: validating
symptom: harness-scripts 단계가 verify 합계의 최대 비중을 차지한다 — 2026-10-07 실측 212.8초(86건), 2026-10-09 실측 358.8초, 2026-10-10 다섯 번 실측 219.8~303.6초(38% 변동). 2026-10-11 프로파일로 원인이 드러났다 — 테스트 수가 아니라 `verify.sh` 의 **시작 비용 38.5초**가 테스트 안에서 세 번 되풀이되는 것이다
evidence: |
  2026-10-07 api-unit 쪼개기 실측(improvement-log 2026-10-06-002): tests/scripts 261초(86건),
  tests/arch 31초(25건), 제품 테스트 전부 23초(413건). 즉 테스트 1건당 비용이 제품 테스트의
  약 50배다.
  2026-10-09 P3-2b 의 verify: harness-scripts 358.8초, 합계 736,213 ms 로 예산 600,000 ms 초과
  (선택 실패 1건). 그 단위는 tests/scripts 에 테스트를 더하지 않았으므로 증가분은 부하이거나
  복사 비용의 변동이다 — 어느 쪽이든 이 단계가 예산을 가장 크게 먹는다는 사실은 같다.
  2026-10-10 하루 동안 같은 저장소에서 이 단계가 다섯 번 측정됐다 — P3-4 에서 259.6초와
  303.6초, P3-5 에서 242.0초와 219.8초, Phase 3 완료 판정에서 261.4초. 테스트 수는
  그대로다. 즉 **같은 테스트가 84초(38%) 흔들린다**. 그 날의 합계는 각각 540,275 /
  592,021 / 530,333 / 491,515 / 545,184 ms 였고, 둘째 실행은 예산 600,000 ms 대비
  **여유가 8초**였다. 다섯째 실행에서는 이 단계가 합계의 48%를 차지했다. 비용의 절대값만큼 **변동폭**이
  문제다 — 예산 판정이 그 변동에 걸려 있으면 같은 커밋이 통과와 초과를 왕복한다.
  예산을 올리는 것은 사람의 결정이다(EI-2) — 올리면 '느린 것은 제품이 아니라 하네스
  자신' 이라는 사실이 가려진다.
  2026-10-11 테스트별 소요 실측(`pytest --durations`, 89건 합 240.9초):
    test_verify_lock.py      3건 146.4초 (50.9 / 50.7 / 44.8)  ← 합계의 61%
    test_guard_protected.py 12건 약 35초  (최대 6.9초)
    나머지 74건             약 59초
  첫 줄이 결정적이다. 그 세 건은 각각 `verify.sh --only syntax` 를 띄우는데, **락이 잡혀
  단계를 하나도 돌리지 않고 끝나는 첫 건도 44.8초**다. 즉 비용은 단계가 아니라 시작이다.
  단독 측정: 락을 잡아 둔 채 `verify.sh --only syntax` → 종료 코드 4, **38.6초**.
  `bash -x` 프로파일(38,379줄)에서 간격의 거의 전부가 `common.sh:185`
  `git -C … hash-object -- <파일>` 였다 — 801개 파일에 프로세스 801개다.
  읽기 전용 비교(2026-10-11): 같은 필터로 `git hash-object --stdin-paths` 를 한 번 부르면
  지문 값이 동일하고(code ca3f05f9… / docs 84c4bc09…) 소요는 38.8초 → 0.99초다.
  번들 복사(`_copy_bundle`, shutil.copytree)도 실재하지만 약 35초로 **두 번째**다.
  2026-10-11 고치는 중에 **두 번째 결함**이 드러났다. 이 함수의 주석은 "커밋·stage 에
  불변입니다" 라고 약속하는데 실제로는 그렇지 않았다 — `ls-files --cached --others` 는
  **비추적 파일을 추적 파일보다 먼저** 내보내므로, `git add` 로 비추적이 추적으로
  옮겨가는 것만으로 입력 순서가 바뀌어 지문이 달라졌다(실측: 내용 동일, 값
  c7a84f04… → 09e3d445…). 형제 함수 `harness_tree_fingerprint` 는 처음부터
  `LC_ALL=C sort` 를 거치는데 이 함수에는 그 한 줄이 없었다. 그래서 `--changed` 는
  커밋마다 코드 범위를 다시 골랐다 — 비용을 줄이려고 만든 기능이 비싸기만 하고
  동작하지도 않았다.
  새 테스트 `tests/scripts/test_scope_fingerprint.py` 8건이 이 둘을 고정한다. 구현 전
  red: 순서 테스트 1건 실패(위 두 값), 프로세스 수 테스트 2건 실패(24개 파일짜리
  저장소에서 code 17회·docs 8회 — 파일 수에 비례). 변이 2건으로 무력하지 않음을
  확인했다 — `LC_ALL=C sort` 를 지우면 순서 테스트만 실패하고, 일괄 호출을 끄면
  프로세스 수 테스트 2건만 실패한다(그 변이에서 같은 파일의 소요가 6.8초 → 26.8초로
  늘어 비용 모형도 재확인됐다).
root_cause: "[2026-10-11 정정] scope 지문(`harness_scope_fingerprint`, `harness/scripts/lib/common.sh`)이 **파일마다 `git hash-object` 프로세스를 하나씩 띄운다**. 이 저장소는 추적+비추적 801개 파일이고 Windows 의 프로세스 생성이 1건당 약 0.05초여서 지문 한 벌이 약 29초(code) + 10초(docs) = 38.5초다. 그 비용은 단계를 하나도 돌리지 않는 실행에도 든다. 처음 적은 '번들 전체 복사' 는 1순위가 아니었다 — 복사도 실재하지만 약 35초이고, 1순위는 중첩된 verify 시작 3회(약 115초)다. 비용을 줄이려고 넣은 기능(`--changed` 범위 판정, 2026-10-04-001)이 Windows 에서 비용의 최대 항목이 된 것이다. 같은 함수에 **두 번째** 원인이 있었다 — 입력을 정렬하지 않아 `ls-files --cached --others` 의 순서(비추적이 먼저)가 `git add` 에 따라 바뀌었고, 주석이 약속한 커밋·stage 불변이 깨져 `--changed` 가 커밋마다 전량을 다시 골랐다"
fix: "2026-10-11 적용(저장소 소유자의 명시적 지시, 가드의 HARNESS_ALLOW_GUARDED_EDIT 경로). 둘을 함께 고쳤다 — (1) 필터를 지난 경로를 모아 `git hash-object --stdin-paths` 를 한 번만 부른다(줄바꿈 포함 경로가 있으면 기존 루프로 떨어진다), (2) 입력을 `LC_ALL=C sort` 로 정렬해 순서 불변을 만든다. 락을 잡아 둔 채 `verify.sh --only syntax` 가 38.6초 → 2.87/3.58/3.04초로, 종료 코드는 그대로 4다. (2) 때문에 지문 **값은 한 번 달라진다** — 적용 직후 한 번은 전량 실행이 되고 그 뒤로 안정된다"
recurrence_risk: high
harness_element: HE-3
proposed_harness_change: "(사람 결정, 보호 파일 `harness/scripts/lib/common.sh`) (1) `harness_scope_fingerprint` 의 파일별 `git hash-object -- \"$p\"` 호출을, 같은 필터로 고른 경로 목록을 모아 `git hash-object --stdin-paths` 를 **한 번** 부르는 것으로 바꾼다. 지문 입력의 바이트 열(`경로\0해시\n`)을 그대로 유지하면 지문 값이 바뀌지 않는다 — 2026-10-11 에 읽기 전용 비교로 확인했다(code·docs 둘 다 동일). 경로에 줄바꿈이 있으면 `--stdin-paths` 가 갈라 읽으므로 그 경우에만 기존 루프로 떨어진다. (2) 그 뒤 `test_verify_lock.py` 의 세 건을 다시 측정한다 — 세 건 합이 146.4초였고 그중 약 115초가 (1)의 비용이다. (1)만으로 충분하면 테스트 구조는 건드리지 않는다. 남는 2순위는 `_copy_bundle`(약 35초)이고, 그것은 세션 범위 공유본 + 쓰기 테스트만 자기 복사본으로 줄일 수 있다 — (1) 뒤에 다시 재어 보고 판단한다. (3) 예산(600,000 ms)은 올리지 않는다(EI-2) — (1)이 합계를 약 130초 줄이므로 올릴 이유가 없고, 올리면 이 비용이 다시 보이지 않게 된다. 측정 없이 테스트를 지우는 것은 하지 않는다 — 검출력은 그대로 유지한다"
preferred_enforcement: test
trust: untrusted
regression_check: |
  대상: (1)(2)를 적용한 뒤 verify 3회. 2026-10-11 현재 1회 완료, 2회 남음.
  사전 기준과 결과:
    (a) 지문이 순서에 불변이다 — git add 전후 값이 같다.
        → 충족. 새 테스트 test_committing_does_not_change_the_fingerprint 가 고정한다.
        주의: (2)가 값 자체를 바꾸므로 **적용 전 값과는 다르다**(c7a84f04… 계열 →
        정렬 뒤 값). 비교 기준은 "적용 후 트리 안에서 커밋 전후가 같다" 다.
    (b) 락이 잡힌 상태의 `verify.sh --only syntax` 가 5초 미만에 종료 코드 4.
        → 충족(2.87 / 3.58 / 3.04초, 적용 전 38.6초).
    (c) harness-scripts 단계가 260초대에서 내려간다. → 아래 "1회차" 참조.
    (d) tests/scripts 테스트 수가 줄지 않는다. → 89건 + 새 8건 = 97건.
  검출력 확인(변이 2건): `LC_ALL=C sort` 제거 → 순서 테스트 1건만 실패. 일괄 호출 해제
  → 프로세스 수 테스트 2건만 실패. 둘 다 되돌린 뒤 8건 전부 통과.
  확인하지 못한 것: 줄바꿈이 들어간 경로의 fallback 분기. NTFS 가 파일명에 줄바꿈을
  허용하지 않아 이 환경에서 그 분기를 실행시킬 수 없다 — 코드 경로는 미검증이다.
  shellcheck 도 이 환경에 없어 돌리지 못했다(verify 의 syntax 단계는 통과).
  1회차 실측(2026-10-11, 적용 직후): PR 본문과 docs 에 적는다.
