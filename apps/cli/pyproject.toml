[project]
name = "aether-cli"
version = "0.0.0"
description = ""
requires-python = ">=3.12"
# 의존성이 비어 있는 것은 **의도**입니다 — spec 0006 D-1: CLI 는 HTTP 를 표준
# 라이브러리(`urllib`)로 칩니다. `httpx` 는 AR-5 가 저장소 전체에서 금지하고
# (허용된 자리는 `aether_runtime.adapters.outbound.model_gateway` 하나),
# `requests`·`aiohttp` 를 들이면 그 계약에 줄을 더해야 합니다(보호 파일).
# 오프라인 설치 표면을 늘리지 않는 것도 같은 방향입니다(DP-4).
dependencies = []

[project.scripts]
aether = "aether_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_cli"]
