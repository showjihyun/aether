[alembic]
# versions/ lives under the same directory as this file (apps/api/migrations).
script_location = %(here)s

# Placeholder only. env.py always overwrites this with ALEMBIC_URL or
# Settings().database_url (spec 2.8, plan P0-8 step 3). Kept ASCII-only:
# Alembic reads this file with encoding="locale", which is not UTF-8 on
# every machine (observed: cp949 on a Korean-locale Windows host).
sqlalchemy.url = driver://not-used:not-used@localhost/not-used

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
