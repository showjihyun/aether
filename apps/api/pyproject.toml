[project]
name = "aether-api"
version = "0.0.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
aether-api = "aether_api.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_api"]
