[project]
name = "aether-runtime"
version = "0.0.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "psycopg[binary]",
    "redis",
    "httpx",
    "opentelemetry-sdk>=1.44.0",
    "aether-mcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_runtime"]

[tool.uv.sources]
aether-mcp = { workspace = true }
