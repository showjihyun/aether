[project]
name = "aether"
version = "0.0.0"
description = "aether — Open Hybrid Enterprise AI OS (uv workspace root)"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/runtime",
    "packages/workflow",
    "packages/context",
    "packages/memory",
    "packages/mcp",
    "packages/policy",
    "packages/evaluation",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-socket",
    "import-linter",
    "testcontainers[postgres,redis]",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/arch/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["apps", "packages", "tests"]
exclude = ["tests/arch/fixtures"]
explicit_package_bases = true
mypy_path = [
    "apps/api/src",
    "apps/worker/src",
    "packages/runtime/src",
    "packages/workflow/src",
    "packages/context/src",
    "packages/memory/src",
    "packages/mcp/src",
    "packages/policy/src",
    "packages/evaluation/src",
]

[tool.pytest.ini_options]
testpaths = ["apps", "packages", "tests"]
norecursedirs = ["fixtures", "node_modules", ".venv"]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1"
markers = [
    "integration: 실제 컨테이너가 필요한 테스트",
]
